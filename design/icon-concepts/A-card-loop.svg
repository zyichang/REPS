<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 方向 A:一张卡片,外面一圈循环箭头 = 卡片一遍又一遍地回来 -->
  <rect width="1024" height="1024" fill="#0B0D12"/>
  <!-- 循环:约 300° 的圆弧,圆头,结尾接箭头 -->
  <path d="M 512 262 A 250 250 0 1 1 296.5 385.3" fill="none" stroke="#3B82F6" stroke-width="56" stroke-linecap="round"/>
  <path d="M 228 330 L 330 300 L 318 410 Z" fill="#3B82F6" stroke="#3B82F6" stroke-width="20" stroke-linejoin="round"/>
  <!-- 中间的卡片 -->
  <rect x="402" y="422" width="220" height="180" rx="30" fill="#FFFFFF"/>
  <rect x="440" y="470" width="144" height="22" rx="11" fill="#0B0D12" opacity="0.18"/>
  <rect x="440" y="520" width="96" height="22" rx="11" fill="#0B0D12" opacity="0.18"/>
</svg>
