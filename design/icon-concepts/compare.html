<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:32px;background:#F2F2F7;font-family:"Microsoft YaHei",sans-serif;color:#1C1C1E}
h1{font-size:28px;margin:0 0 24px}
.row{display:flex;align-items:center;gap:36px;padding:20px 24px;margin-bottom:16px;background:#fff;border-radius:20px}
.name{width:220px;font-size:22px;font-weight:600}.name small{display:block;font-weight:400;font-size:15px;color:#8A8A8E;margin-top:6px}
img{display:block}.raw{width:200px;height:200px}
.mask{overflow:hidden;border-radius:22.5%}
.m200{width:200px;height:200px}.m96{width:96px;height:96px}.m48{width:48px;height:48px}
.dark{background:#1C1C1E;padding:18px;border-radius:16px;display:flex;gap:18px;align-items:center}
.cap{font-size:13px;color:#8A8A8E;text-align:center;margin-top:6px}
</style></head><body>
<h1>REPS 图标方案对比(原图 · 圆角遮罩 · 96px · 48px · 深色桌面)</h1>
<script>
const items=[['0-current-book.svg','现在:打开的书','阅读的通用符号'],
['A-card-loop.svg','A 卡片 + 循环','一张卡一遍遍回来'],
['B-zheng-tally.svg','B 正字计数','五笔一组,蓝色是今天这一下'],
['C-spaced-dots.svg','C 间隔越来越大','1、2、4、7 天…']];
for(const [f,n,s] of items){document.write(`<div class="row"><div class="name">${n}<small>${s}</small></div>
<div><img class="raw" src="${f}"><div class="cap">原图</div></div>
<div><div class="mask m200"><img class="m200" src="${f}"></div><div class="cap">遮罩后</div></div>
<div><div class="mask m96"><img class="m96" src="${f}"></div><div class="cap">96px</div></div>
<div><div class="mask m48"><img class="m48" src="${f}"></div><div class="cap">48px</div></div>
<div class="dark"><div class="mask m48"><img class="m48" src="${f}"></div><div class="mask m48"><img class="m48" src="${f}"></div></div></div>`)}
</script></body></html>
