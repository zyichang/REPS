    title: "机会成本"
    front: "什么是机会成本?"
    back: "为了得到某样东西而必须放弃的、价值最高的那个选择。"
    tags: [经济学]

  - id: ex-qa-2
    type: qa
    front: "TCP 三次握手的三步分别是什么?"
    back: |
      1. 客户端发 **SYN**
      2. 服务器回 **SYN + ACK**
      3. 客户端再发 **ACK**

      > [!TIP]
      > 两次握手不够:服务器无法确认客户端收到了自己的 SYN。

