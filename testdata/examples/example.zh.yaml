  - id: ex-math-1
    type: qa
    front: "一元二次方程 $ax^2+bx+c=0$ 的求根公式是什么?"
    back: |
      $$x = \frac{-b \pm \sqrt{b^2-4ac}}{2a}$$

      其中 $\Delta = b^2-4ac$ 叫 **判别式**。

  - id: ex-code-1
