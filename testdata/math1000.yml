      #### 基础篇 第14章 (1) $\displaystyle\int_{0}^{2}\mathrm{d}y\int_{2}^{y}\frac{y}{\sqrt{1+x^{3}}}\mathrm{d}x=$ ________．
    back: |
      【答案】$-\dfrac{2}{3}$

      【解析】由 $\displaystyle\int_{0}^{2}\mathrm{d}y\int_{2}^{y}\frac{y}{\sqrt{1+x^{3}}}\mathrm{d}x=-\int_{0}^{2}\mathrm{d}y\int_{y}^{2}\frac{y}{\sqrt{1+x^{3}}}\mathrm{d}x$，可知积分区域为 $y=x$、$x=2$ 与 $x$ 轴所围的三角形，则

      $$\int_{0}^{2}\mathrm{d}y\int_{2}^{y}\frac{y}{\sqrt{1+x^{3}}}\mathrm{d}x=-\int_{0}^{2}\frac{1}{\sqrt{1+x^{3}}}\mathrm{d}x\int_{0}^{x}y\,\mathrm{d}y$$

      $$=-\frac{1}{2}\int_{0}^{2}\frac{x^{2}}{\sqrt{1+x^{3}}}\mathrm{d}x=-\frac{1}{6}\int_{0}^{2}(1+x^{3})^{-\frac{1}{2}}\mathrm{d}(x^{3})$$

      $$=-\frac{1}{3}(1+x^{3})^{\frac{1}{2}}\bigg|_{0}^{2}=-\frac{2}{3}.$$
