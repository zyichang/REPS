      #### 基础篇 第9章 (18) 已知函数 $f(x)=\displaystyle\int_{1}^{x}\sqrt{1+t^{3}}\,\mathrm{d}t$，则 $\displaystyle\int_{0}^{1}xf(x)\mathrm{d}x=$ ________．
