      #### 强化篇 第1章 (40) 函数 $f(x)=\dfrac{x|x-1|}{\sin\pi x}$ 的可去间断点的个数为（　）．

      ;;;
      (A) $1$
      (B) $2$
      (C) $3$
      (D) 无穷多个
      ;;;A
    back: |
      【答案】(A)

      【解析】函数 $f(x)$ 的可去间断点可能为 $x=0$ 或 $x=1$．

      因为

      $$\lim_{x\to 0}\frac{x|x-1|}{\sin\pi x}=\lim_{x\to 0}\frac{x}{\sin\pi x}=\lim_{x\to 0}\frac{x}{\pi x}=\frac{1}{\pi},$$

      所以 $x=0$ 是函数 $f(x)$ 的可去间断点．

      因为

      $$\lim_{x\to 1^{+}}\frac{x|x-1|}{\sin\pi x}=\lim_{x\to 1^{+}}\frac{x-1}{\sin\pi x}\xlongequal{\text{洛必达法则}}\lim_{x\to 1^{+}}\frac{1}{\pi\cos\pi x}=-\frac{1}{\pi},$$

      $$\lim_{x\to 1^{-}}\frac{x|x-1|}{\sin\pi x}=\lim_{x\to 1^{-}}\frac{1-x}{\sin\pi x}\xlongequal{\text{洛必达法则}}\lim_{x\to 1^{-}}\frac{-1}{\pi\cos\pi x}=\frac{1}{\pi},$$

      所以 $x=1$ 不是函数 $f(x)$ 的可去间断点．

      综上，函数 $f(x)$ 的可去间断点的个数为 $1$．
