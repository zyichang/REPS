      #### 基础篇 第1章 (8) 设 $f(x)=\arcsin(\sin x)$．

      （1）证明 $f(x)$ 以 $2\pi$ 为周期；\
      （2）求 $f(x)$ 在 $\left[-\dfrac{\pi}{2},\dfrac{3}{2}\pi\right)$ 上的表达式并作图．
    back: |
      【解析】（1）$f(x+2\pi)=\arcsin[\sin(x+2\pi)]=\arcsin(\sin x)=f(x)$，证毕．

      （2）当 $x\in\left[-\dfrac{\pi}{2},\dfrac{\pi}{2}\right)$ 时，$\arcsin(\sin x)=x$；

      当 $x\in\left[\dfrac{\pi}{2},\dfrac{3}{2}\pi\right)$ 时，有 $\pi-x\in\left(-\dfrac{\pi}{2},\dfrac{\pi}{2}\right]$，$\arcsin(\sin x)=\arcsin[\sin(\pi-x)]=\pi-x$．

      故

      $$f(x)=\begin{cases}x,&x\in\left[-\dfrac{\pi}{2},\dfrac{\pi}{2}\right),\\[2mm]\pi-x,&x\in\left[\dfrac{\pi}{2},\dfrac{3}{2}\pi\right),\end{cases}$$

      其图形如图所示．
