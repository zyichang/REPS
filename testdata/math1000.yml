      #### 基础篇 第14章 (12) 计算 $I=\displaystyle\int_{0}^{1}\mathrm{d}y\int_{y}^{\sqrt{2y-y^{2}}}\frac{1}{\sqrt{x^{2}+y^{2}}\cdot\sqrt{4-x^{2}-y^{2}}}\mathrm{d}x$．
