      #### 基础篇 第14章 (14) 设平面区域 $D=\{(x,y)\mid x+y\leqslant 1,x\geqslant 0,y\geqslant 0\}$，计算 $\displaystyle\iint_{D}\frac{\mathrm{e}^{-(x+y)}}{\sqrt{xy}}\mathrm{d}\sigma$．
    back: |
      【解析】**方法一** 用极坐标系．

      $$原式=\int_{0}^{\frac{\pi}{2}}\mathrm{d}\theta\int_{0}^{\frac{1}{\cos\theta+\sin\theta}}\frac{\mathrm{e}^{-r(\cos\theta+\sin\theta)}}{\sqrt{\cos\theta\sin\theta}}\mathrm{d}r$$

      $$=\int_{0}^{\frac{\pi}{2}}\left[\frac{1}{\sqrt{\cos\theta\sin\theta}}\cdot\frac{-1}{\cos\theta+\sin\theta}\cdot\mathrm{e}^{-r(\cos\theta+\sin\theta)}\bigg|_{r=0}^{r=\frac{1}{\cos\theta+\sin\theta}}\right]\mathrm{d}\theta$$

      $$=\left(1-\frac{1}{\mathrm{e}}\right)\int_{0}^{\frac{\pi}{2}}\frac{1}{(\cos\theta+\sin\theta)\sqrt{\cos\theta\sin\theta}}\mathrm{d}\theta$$

      $$=\left(1-\frac{1}{\mathrm{e}}\right)\int_{0}^{\frac{\pi}{2}}\frac{\mathrm{d}\theta}{\cos^{2}\theta(1+\tan\theta)\sqrt{\tan\theta}}$$

      $$=\left(1-\frac{1}{\mathrm{e}}\right)\int_{0}^{\frac{\pi}{2}}\frac{\mathrm{d}(\tan\theta)}{(1+\tan\theta)\sqrt{\tan\theta}}$$

      $$\xlongequal{\tan\theta=u}\left(1-\frac{1}{\mathrm{e}}\right)\int_{0}^{+\infty}\frac{\mathrm{d}u}{(1+u)\sqrt{u}}$$

      $$=\left(1-\frac{1}{\mathrm{e}}\right)\cdot 2\int_{0}^{+\infty}\frac{\mathrm{d}(\sqrt{u})}{1+(\sqrt{u})^{2}}=2\left(1-\frac{1}{\mathrm{e}}\right)\cdot\arctan\sqrt{u}\bigg|_{0}^{+\infty}=\pi\left(1-\frac{1}{\mathrm{e}}\right).$$

      **方法二** 用换元法．

      令 $\begin{cases}u=-(x+y),\\ v=x,\end{cases}$ 则 $D'=\{(u,v)\mid -1\leqslant u\leqslant 0,0\leqslant v\leqslant 1,-1\leqslant u+v\leqslant 0\}$，

      $$原式=\iint_{D'}\frac{\mathrm{e}^{u}}{\sqrt{v(-v-u)}}\left|\begin{matrix}\dfrac{\partial x}{\partial u}&\dfrac{\partial x}{\partial v}\\[2mm] \dfrac{\partial y}{\partial u}&\dfrac{\partial y}{\partial v}\end{matrix}\right|\mathrm{d}u\mathrm{d}v=\iint_{D'}\frac{\mathrm{e}^{u}}{\sqrt{v(-v-u)}}\mathrm{d}u\mathrm{d}v$$

      $$=\int_{-1}^{0}\mathrm{d}u\int_{0}^{-u}\frac{\mathrm{e}^{u}}{\sqrt{-v^{2}-uv}}\mathrm{d}v=\int_{-1}^{0}\mathrm{e}^{u}\left(\arcsin\frac{v+\dfrac{u}{2}}{-\dfrac{u}{2}}\right)\bigg|_{0}^{-u}\mathrm{d}u$$

      $$=\int_{-1}^{0}\mathrm{e}^{u}\left(\frac{\pi}{2}+\frac{\pi}{2}\right)\mathrm{d}u=\int_{-1}^{0}\pi\mathrm{e}^{u}\,\mathrm{d}u=\pi\left(1-\frac{1}{\mathrm{e}}\right).$$
