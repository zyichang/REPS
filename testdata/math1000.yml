      #### 强化篇 第1章 (14) 计算 $\lim\limits_{x\to+\infty}\left[\dfrac{x^{x+1}}{(1+x)^{x}}-\dfrac{x}{\mathrm{e}}\right]$．
    back: |
      【解析】

      $$\lim_{x\to+\infty}\left[\frac{x^{x+1}}{(1+x)^{x}}-\frac{x}{\mathrm{e}}\right]=\lim_{x\to+\infty}\left[\frac{x}{\left(1+\frac{1}{x}\right)^{x}}-\frac{x}{\mathrm{e}}\right]=\lim_{x\to+\infty}\frac{x\left[\mathrm{e}-\left(1+\frac{1}{x}\right)^{x}\right]}{\mathrm{e}\left(1+\frac{1}{x}\right)^{x}}$$

      $$=\frac{1}{\mathrm{e}^{2}}\lim_{x\to+\infty}\frac{\mathrm{e}-\left(1+\frac{1}{x}\right)^{x}}{\frac{1}{x}}\xlongequal{\frac{1}{x}=u}\frac{1}{\mathrm{e}^{2}}\lim_{u\to 0^{+}}\frac{\mathrm{e}-(1+u)^{\frac{1}{u}}}{u}$$

      $$=-\frac{1}{\mathrm{e}^{2}}\lim_{u\to 0^{+}}\frac{\mathrm{e}^{\frac{1}{u}\ln(1+u)}-\mathrm{e}}{u}=-\frac{\mathrm{e}}{\mathrm{e}^{2}}\lim_{u\to 0^{+}}\frac{\mathrm{e}^{\frac{1}{u}\ln(1+u)-1}-1}{u}$$

      $$=-\frac{1}{\mathrm{e}}\lim_{u\to 0^{+}}\frac{\frac{1}{u}\ln(1+u)-1}{u}=-\frac{1}{\mathrm{e}}\lim_{u\to 0^{+}}\frac{\ln(1+u)-u}{u^{2}}$$

      $$\xlongequal{\text{洛必达法则}}-\frac{1}{\mathrm{e}}\lim_{u\to 0^{+}}\frac{\frac{1}{1+u}-1}{2u}=-\frac{1}{\mathrm{e}}\lim_{u\to 0^{+}}\frac{-u}{2u(1+u)}=\frac{1}{2\mathrm{e}}.$$

      【注】应随时注意化简：将幂指函数化为指数函数，能求出极限（其极限值不为零的因子），可利用乘积极限先求出，作变量替换将形式化简，以及用等价无穷小替换等．不要一上来就用洛必达法则．
