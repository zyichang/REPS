      #### 基础篇 第9章 (1)-(3) 计算不定积分 $\displaystyle\int\sec x\,\mathrm{d}x$．
    back: |
      【解析】**方法一**

      $$\int\sec x\,\mathrm{d}x=\int\frac{\sec x(\sec x+\tan x)}{\sec x+\tan x}\mathrm{d}x=\int\frac{\mathrm{d}(\sec x+\tan x)}{\sec x+\tan x}=\ln|\sec x+\tan x|+C.$$

      **方法二**

      $$\int\sec x\,\mathrm{d}x=\int\frac{\mathrm{d}x}{\cos x}=\int\frac{\mathrm{d}\left(x+\dfrac{\pi}{2}\right)}{\sin\left(x+\dfrac{\pi}{2}\right)}=\int\frac{\mathrm{d}\left(x+\dfrac{\pi}{2}\right)}{2\sin\left(\dfrac{x}{2}+\dfrac{\pi}{4}\right)\cos\left(\dfrac{x}{2}+\dfrac{\pi}{4}\right)}$$

      $$=\int\frac{\sec^{2}\left(\dfrac{x}{2}+\dfrac{\pi}{4}\right)\mathrm{d}\left(\dfrac{x}{2}+\dfrac{\pi}{4}\right)}{\tan\left(\dfrac{x}{2}+\dfrac{\pi}{4}\right)}=\ln\left|\tan\left(\frac{x}{2}+\frac{\pi}{4}\right)\right|+C.$$
