      【解析】积分区域由 $y=x$ 与圆 $x^{2}+y^{2}=2y$ 围成，则

      $$I=\int_{0}^{1}\mathrm{d}y\int_{y}^{\sqrt{2y-y^{2}}}\frac{1}{\sqrt{x^{2}+y^{2}}\cdot\sqrt{4-x^{2}-y^{2}}}\mathrm{d}x$$

      $$=\int_{0}^{\frac{\pi}{4}}\mathrm{d}\theta\int_{0}^{2\sin\theta}\frac{1}{\sqrt{4-r^{2}}}\mathrm{d}r=\int_{0}^{\frac{\pi}{4}}\arcsin\frac{r}{2}\bigg|_{0}^{2\sin\theta}\mathrm{d}\theta$$

      $$=\int_{0}^{\frac{\pi}{4}}\theta\,\mathrm{d}\theta=\frac{1}{2}\theta^{2}\bigg|_{0}^{\frac{\pi}{4}}=\frac{\pi^{2}}{32}.$$
