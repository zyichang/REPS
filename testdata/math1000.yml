      【解析】令 $\sin x=\dfrac{2t}{1+t^{2}}$，$\cos x=\dfrac{1-t^{2}}{1+t^{2}}$，其中 $t=\tan\dfrac{x}{2}$，则 $\mathrm{d}x=\dfrac{2\mathrm{d}t}{1+t^{2}}$，故

