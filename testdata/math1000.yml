      #### 基础篇 第14章 (10) 计算二重积分 $\displaystyle\iint_{D}\sqrt{1-x^{2}-y^{2}}\,\mathrm{d}\sigma$，其中 $D=\{(x,y)\mid x^{2}+y^{2}\leqslant y\}$．
    back: |
      【解析】由**对称性**，用极坐标．

      $$\iint_{D}\sqrt{1-x^{2}-y^{2}}\,\mathrm{d}x\mathrm{d}y=2\int_{0}^{\frac{\pi}{2}}\mathrm{d}\theta\int_{0}^{\sin\theta}\sqrt{1-r^{2}}\,r\,\mathrm{d}r$$

      $$=-\int_{0}^{\frac{\pi}{2}}\mathrm{d}\theta\int_{0}^{\sin\theta}(1-r^{2})^{\frac{1}{2}}\mathrm{d}(1-r^{2})$$

      $$=-\int_{0}^{\frac{\pi}{2}}\frac{2}{3}(1-r^{2})^{\frac{3}{2}}\bigg|_{0}^{\sin\theta}\mathrm{d}\theta$$

      $$=-\frac{2}{3}\cdot\int_{0}^{\frac{\pi}{2}}(\cos^{3}\theta-1)\mathrm{d}\theta$$

      $$=-\frac{2}{3}\left(\frac{2}{3}-\frac{\pi}{2}\right)=\frac{\pi}{3}-\frac{4}{9}.$$
