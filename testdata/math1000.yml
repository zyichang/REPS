      #### 基础篇 第5章 (7) 曲线 $y(x)=\ln\left|\mathrm{e}^{2x}-1\right|$ 的斜渐近线为（　）．

      ;;;
      A. $y=2x+\dfrac{1}{\mathrm{e}}$
      B. $y=2x$
      C. $y=-2x+\dfrac{1}{\mathrm{e}}$
      D. $y=-2x$
      ;;;B
    back: |
      【答案】(B)

      【解析】因为

      $$\lim_{x\to+\infty}\frac{\ln\left|\mathrm{e}^{2x}-1\right|}{x}=\lim_{x\to+\infty}\frac{\ln\left(\mathrm{e}^{2x}-1\right)}{x}=\lim_{x\to+\infty}\frac{2\mathrm{e}^{2x}}{\mathrm{e}^{2x}-1}=2,$$

      且

      $$\lim_{x\to+\infty}\left(\ln\left|\mathrm{e}^{2x}-1\right|-2x\right)=\lim_{x\to+\infty}\left[\ln\left(\mathrm{e}^{2x}-1\right)-\ln\mathrm{e}^{2x}\right]=\lim_{x\to+\infty}\ln\left(1-\mathrm{e}^{-2x}\right)=0,$$

      所以直线 $y=2x$ 是曲线 $y(x)$ 在 $x\to+\infty$ 方向上的一条**斜渐近线**．

      因为

      $$\lim_{x\to-\infty}\ln\left|\mathrm{e}^{2x}-1\right|=\ln 1=0,$$

      所以 $y=0$ 是曲线 $y(x)$ 在 $x\to-\infty$ 方向上的一条**水平渐近线**，不是斜渐近线．
