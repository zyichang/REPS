      #### 强化篇 第1章 (17) 设函数 $f(x)$ 在点 $x=0$ 的某一邻域内可导，且 $f(0)=0$，$f'(0)\neq 0$，求 $\lim\limits_{x\to 0}\dfrac{\displaystyle\int_{0}^{x^{2}}f(t)\mathrm{d}t}{x^{2}\displaystyle\int_{0}^{x}f(t)\mathrm{d}t}$．
    back: |
      【解析】由于函数 $f(x)$ 在点 $x=0$ 的某一邻域内可导，且 $f(0)=0$，$f'(0)\neq 0$，因此

      $$\lim_{x\to 0}\frac{f(x)}{x}=\lim_{x\to 0}\frac{f(x)-f(0)}{x-0}=f'(0)\neq 0,\quad \lim_{x\to 0}\frac{\int_{0}^{x}f(t)\mathrm{d}t}{x^{2}}=\lim_{x\to 0}\frac{f(x)}{2x}=\frac{1}{2}f'(0)\neq 0.$$

      于是，

      $$\lim_{x\to 0}\frac{\int_{0}^{x^{2}}f(t)\mathrm{d}t}{x^{2}\int_{0}^{x}f(t)\mathrm{d}t}=\lim_{x\to 0}\frac{2xf(x^{2})}{2x\int_{0}^{x}f(t)\mathrm{d}t+x^{2}f(x)}=\lim_{x\to 0}\frac{2f(x^{2})}{2\int_{0}^{x}f(t)\mathrm{d}t+xf(x)}$$

      $$=\lim_{x\to 0}\frac{2\frac{f(x^{2})}{x^{2}}}{2\frac{\int_{0}^{x}f(t)\mathrm{d}t}{x^{2}}+\frac{f(x)}{x}}=\frac{2\lim\limits_{x\to 0}\frac{f(x^{2})}{x^{2}}}{2\lim\limits_{x\to 0}\frac{\int_{0}^{x}f(t)\mathrm{d}t}{x^{2}}+\lim\limits_{x\to 0}\frac{f(x)}{x}}=\frac{2f'(0)}{2f'(0)}=1.$$
