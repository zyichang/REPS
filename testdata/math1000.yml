      #### 基础篇 第5章 (1) 函数 $y=\mathrm{e}^{x}+\dfrac{\mathrm{e}^{-x}}{2}$ 的最小值为 ________．
    back: |
      【答案】$\sqrt{2}$

      【解析】**方法一**

      $$\mathrm{e}^{x}+\frac{\mathrm{e}^{-x}}{2}\geqslant 2\sqrt{\mathrm{e}^{x}\cdot\frac{\mathrm{e}^{-x}}{2}}=\sqrt{2},$$

      当且仅当 $x=\dfrac{1}{2}\ln\dfrac{1}{2}$ 时，等号成立，故 $y$ 的最小值为 $\sqrt{2}$．

      **方法二**

      $$y'=\mathrm{e}^{x}-\frac{1}{2}\mathrm{e}^{-x}=\frac{2\mathrm{e}^{2x}-1}{2\mathrm{e}^{x}},\quad y''=\mathrm{e}^{x}+\frac{1}{2\mathrm{e}^{x}}>0.$$

      令 $y'=0$，解得 $x=\dfrac{1}{2}\ln\dfrac{1}{2}$，且 $y'$ 为增函数，故当 $x=\dfrac{1}{2}\ln\dfrac{1}{2}$ 时，$y$ 取到最小值，最小值为

      $$y\bigg|_{x=\frac{1}{2}\ln\frac{1}{2}}=\mathrm{e}^{\frac{1}{2}\ln\frac{1}{2}}+\frac{\mathrm{e}^{-\frac{1}{2}\ln\frac{1}{2}}}{2}=\sqrt{\frac{1}{2}}+\frac{1}{2}\cdot\frac{1}{\sqrt{\dfrac{1}{2}}}=\sqrt{2}.$$
