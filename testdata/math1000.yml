      #### 强化篇 第1章 (16) 求极限 $\lim\limits_{x\to 0}\left[\dfrac{1+\displaystyle\int_{0}^{x}(1+t)^{\frac{1}{t}}\mathrm{d}t}{x}-\dfrac{1}{\sin x}\right]$．
    back: |
