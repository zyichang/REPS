      #### 强化篇 第1章 (11) $\lim\limits_{x\to 0}\dfrac{\displaystyle\int_{\sin x}^{x}\sqrt{3+t^{2}}\,\mathrm{d}t}{x\left(\mathrm{e}^{x^{2}}-1\right)}=$ ________．
    back: |
      【答案】$\dfrac{\sqrt{3}}{6}$

      【解析】原式 $=\lim\limits_{x\to 0}\dfrac{\sqrt{3+\xi^{2}}(x-\sin x)}{x^{3}}$，其中 $\xi$ 介于 $\sin x$ 和 $x$ 之间．又

      $$\lim_{x\to 0}\frac{x-\sin x}{x^{3}}=\lim_{x\to 0}\frac{\frac{1}{6}x^{3}}{x^{3}}=\frac{1}{6},$$

      故

      $$\text{原式}=\lim_{\xi\to 0}\frac{1}{6}\sqrt{3+\xi^{2}}=\frac{\sqrt{3}}{6}.$$
