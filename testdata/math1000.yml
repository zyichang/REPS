      【答案】$1$

      【解析】由题设知，$\sqrt{f(1)}=\sqrt{2}$，则 $f(1)=2$．又

      $$y'=\frac{f'(x)}{2\sqrt{f(x)}},$$

      $$y''=\frac{f''(x)\cdot\sqrt{f(x)}-f'(x)\cdot\dfrac{f'(x)}{2\sqrt{f(x)}}}{2f(x)}=\frac{2f''(x)f(x)-\left[f'(x)\right]^{2}}{4\left[f(x)\right]^{\frac{3}{2}}},$$

      由 $(1,\sqrt{2})$ 是拐点，有 $y''(1)=0$，即 $2f''(1)f(1)-\left[f'(1)\right]^{2}=0$，于是 $f''(1)=1$．
