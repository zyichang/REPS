      #### 基础篇 第12章 (2)-(1) 有一内表面为旋转抛物面的水缸，其深为 $a$（单位：米），缸口直径为 $2a$（单位：米），缸内盛满了水，设水的密度为 $\rho$（单位：千克／立方米）．若以每秒 $Q$ 立方米的速率将缸中的水全部抽出，问共需多少时间？
    back: |
      【解析】以缸底中心为原点，对称轴为 $y$ 轴在轴截面上建立平面直角坐标系，则可设缸内表面（旋转抛物面）是由抛物线 $y=kx^{2}$ 绕 $y$ 轴旋转而成的．根据题意，$y(a)=a$，故 $k=\dfrac{1}{a}$，即抛物线方程为 $y=\dfrac{1}{a}x^{2}$．

      于是，缸的容积为

      $$V=\pi\int_{0}^{a}x^{2}\mathrm{d}y=\pi\int_{0}^{a}ay\,\mathrm{d}y=\frac{\pi a^{3}}{2}\ (\text{立方米}).$$

      因此，若以每秒 $Q$ 立方米的速率将缸中的水全部抽出，则需要的时间为

      $$t=\frac{V}{Q}=\frac{\dfrac{\pi a^{3}}{2}}{Q}=\frac{\pi a^{3}}{2Q}\ (\text{秒}).$$
  - front: |
      #### 基础篇 第12章 (2)-(2) 有一内表面为旋转抛物面的水缸，其深为 $a$（单位：米），缸口直径为 $2a$（单位：米），缸内盛满了水，设水的密度为 $\rho$（单位：千克／立方米）．若以每秒 $Q$ 立方米的速率将缸中的水全部抽出，问需做多少功？
    back: |
      【解析】取 $y$ 为积分变量，其取值范围为 $[0,a]$．在 $y$ 轴上的区间 $[0,a]$ 内任取一个典型小区间 $[y,y+\mathrm{d}y]$，则在该典型小区间上需做功的微元为

      $$\mathrm{d}W=\rho g\pi x^{2}\mathrm{d}y\cdot(a-y)=\rho g\pi ay(a-y)\mathrm{d}y=\rho g\pi a(ay-y^{2})\mathrm{d}y.$$

      于是，所求功为

      $$W=\int_{0}^{a}\rho g\pi a(ay-y^{2})\mathrm{d}y=\rho g\pi a\left(\frac{1}{2}ay^{2}-\frac{1}{3}y^{3}\right)\bigg|_{0}^{a}=\frac{1}{6}\rho g\pi a^{4}\ (\text{焦耳}).$$
