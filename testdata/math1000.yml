      #### 强化篇 第1章 (41) 函数 $f(x)=\dfrac{x^{2}\ln|x|}{(x^{2}-1)\sin x}$ 的可去间断点的个数为（　）．

      ;;;
      (A) $1$
      (B) $2$
      (C) $3$
      (D) $4$
      ;;;C
    back: |
      【答案】(C)

      【解析】$f(x)$ 为初等函数，其定义域为 $\{x\mid x\neq-1,x\neq 1,x\neq k\pi\ (k\in\mathbf{Z})\}$，故 $f(x)$ 的间断点为 $x=-1$，$x=1$，$x=k\pi\ (k\in\mathbf{Z})$．因为

      $$\lim_{x\to-1}f(x)=\lim_{x\to-1}\frac{x^{2}\ln(-x)}{(x^{2}-1)\sin x}=\lim_{x\to-1}\frac{\ln[1-(x+1)]}{(x-1)(x+1)}\cdot\lim_{x\to-1}\frac{x^{2}}{\sin x}$$

      $$=-\frac{1}{\sin 1}\lim_{x\to-1}\frac{-(x+1)}{(x-1)(x+1)}=-\frac{1}{\sin 1}\lim_{x\to-1}\frac{-1}{x-1}=-\frac{1}{2\sin 1},$$

      $$\lim_{x\to 1}f(x)=\lim_{x\to 1}\frac{x^{2}\ln x}{(x^{2}-1)\sin x}=\lim_{x\to 1}\frac{\ln[1+(x-1)]}{(x-1)(x+1)}\cdot\lim_{x\to 1}\frac{x^{2}}{\sin x}=\frac{1}{\sin 1}\lim_{x\to 1}\frac{x-1}{(x-1)(x+1)}=\frac{1}{\sin 1}\lim_{x\to 1}\frac{1}{x+1}=\frac{1}{2\sin 1},$$

      $$\lim_{x\to 0}f(x)=\lim_{x\to 0}\frac{x^{2}\ln|x|}{(x^{2}-1)\sin x}=\lim_{x\to 0}\frac{\ln|x|}{\frac{1}{x}}\cdot\lim_{x\to 0}\frac{x}{(x^{2}-1)\sin x}=-\lim_{x\to 0}(-x)=0,$$

      $$\lim_{x\to k\pi\ (k\neq 0,k\in\mathbf{Z})}f(x)=\lim_{x\to k\pi\ (k\neq 0,k\in\mathbf{Z})}\frac{x^{2}\ln|x|}{(x^{2}-1)\sin x}=\infty,$$

      所以 $x=-1,1,0$ 为可去间断点，而 $x=k\pi\ (k\neq 0,k\in\mathbf{Z})$ 为无穷间断点．因此，函数 $f(x)$ 共有 $3$ 个可去间断点．
