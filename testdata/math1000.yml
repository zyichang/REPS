      #### 基础篇 第14章 (7) 设平面区域 $D$ 由曲线 $y=\sqrt{3(1-x^{2})}$ 与直线 $y=\sqrt{3}x$ 及 $y$ 轴所围成．计算二重积分 $\displaystyle\iint_{D}(x^{2}+y^{2})\mathrm{d}x\mathrm{d}y$．
    back: |
      【解析】由 $r^{2}\sin^{2}\theta+3r^{2}\cos^{2}\theta=3$，得

      $$r^{2}=\frac{3}{3\cos^{2}\theta+\sin^{2}\theta},$$

      则

      $$原式=\int_{\frac{\pi}{3}}^{\frac{\pi}{2}}\mathrm{d}\theta\int_{0}^{\sqrt{\frac{3}{3\cos^{2}\theta+\sin^{2}\theta}}}r^{3}\,\mathrm{d}r$$

      $$=\frac{9}{4}\int_{\frac{\pi}{3}}^{\frac{\pi}{2}}\frac{\tan^{2}\theta+1}{(3+\tan^{2}\theta)^{2}}\mathrm{d}(\tan\theta)$$

      $$=\frac{9}{4}\int_{\sqrt{3}}^{+\infty}\frac{t^{2}+1}{(3+t^{2})^{2}}\mathrm{d}t=\frac{9}{4}\int_{\sqrt{3}}^{+\infty}\frac{t^{2}+3-2}{(t^{2}+3)^{2}}\mathrm{d}t$$

      $$=\frac{9}{4}\int_{\sqrt{3}}^{+\infty}\frac{\mathrm{d}t}{t^{2}+3}-\frac{9}{4}\int_{\sqrt{3}}^{+\infty}\frac{2\mathrm{d}t}{(t^{2}+3)^{2}}$$

      $$=\frac{9}{4}\cdot\frac{1}{\sqrt{3}}\arctan\frac{t}{\sqrt{3}}\bigg|_{\sqrt{3}}^{+\infty}-\frac{1}{4}\left(\frac{3t}{t^{2}+3}+\sqrt{3}\arctan\frac{t}{\sqrt{3}}\right)\bigg|_{\sqrt{3}}^{+\infty}$$

      $$=\frac{3\sqrt{3}\pi}{16}-\frac{(\pi-2)\sqrt{3}}{16}=\frac{\sqrt{3}}{8}(1+\pi).$$
