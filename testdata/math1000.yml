      #### 基础篇 第5章 (4) 已知 $x^{2}+ax^{-3}\geqslant\dfrac{10}{3}\ (x>0)$ 恒成立，则 $a$ 的取值范围为 ________．
    back: |
      【答案】$\left[\dfrac{8}{3}\sqrt{2},+\infty\right)$

      【解析】由关系式，有当 $x>0$ 时，$x^{5}+a\geqslant\dfrac{10}{3}x^{3}$，即 $\dfrac{10}{3}x^{3}-x^{5}\leqslant a$．令 $f(x)=\dfrac{10}{3}x^{3}-x^{5}$，求出 $f(x)$ 在 $x>0$ 时的最大值，即可得出 $a$ 的最小值．因为

      $$f'(x)=10x^{2}-5x^{4}=5x^{2}\left(2-x^{2}\right)\xlongequal{\text{令}}0,$$

      得 $x=\sqrt{2}$，且当 $0<x<\sqrt{2}$ 时，$f'(x)>0$，当 $x>\sqrt{2}$ 时，$f'(x)<0$，于是 $x=\sqrt{2}$ 是唯一极大值点，即最大值点．又

      $$f(\sqrt{2})=\frac{10}{3}\cdot 2\sqrt{2}-4\sqrt{2}=\frac{8}{3}\sqrt{2},$$

      故 $a$ 的取值范围为 $\left[\dfrac{8}{3}\sqrt{2},+\infty\right)$．
