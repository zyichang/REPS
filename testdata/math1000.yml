    back: |
      【解析】

      $$W=\int_{-1}^{1}2\sqrt{1-y^{2}}(1-y)\mathrm{d}y$$

      $$=\int_{-1}^{1}2\sqrt{1-y^{2}}\,\mathrm{d}y-\int_{-1}^{1}2y\sqrt{1-y^{2}}\,\mathrm{d}y$$

      $$=4\int_{0}^{1}\sqrt{1-y^{2}}\,\mathrm{d}y\xlongequal{y=\sin t}4\int_{0}^{\frac{\pi}{2}}\cos^{2}t\,\mathrm{d}t$$

      $$=4\cdot\frac{\pi}{4}=\pi\ (\mathrm{J}),$$

      其中，由于 $2y\sqrt{1-y^{2}}$ 为奇函数，故 $\displaystyle\int_{-1}^{1}2y\sqrt{1-y^{2}}\,\mathrm{d}y=0$．
