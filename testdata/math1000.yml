      #### 强化篇 第1章 (5) $\lim\limits_{x\to 0^{+}}\dfrac{\ln(\mathrm{e}+x)-\mathrm{e}^{x}}{\sqrt{1-\cos x}}=$ ________．
    back: |
      【答案】$\sqrt{2}\left(\mathrm{e}^{-1}-1\right)$

      【解析】

      $$\lim_{x\to 0^{+}}\frac{\ln(\mathrm{e}+x)-\mathrm{e}^{x}}{\sqrt{1-\cos x}}
      =\lim_{x\to 0^{+}}\frac{\ln\left[\mathrm{e}\left(1+\frac{x}{\mathrm{e}}\right)\right]-\mathrm{e}^{x}}{\sqrt{\frac{1}{2}x^{2}}}$$

      $$=\sqrt{2}\cdot\lim_{x\to 0^{+}}\frac{1+\ln\left(1+\frac{x}{\mathrm{e}}\right)-\mathrm{e}^{x}}{x}
      =\sqrt{2}\left[\lim_{x\to 0^{+}}\frac{\ln\left(1+\frac{x}{\mathrm{e}}\right)}{x}-\lim_{x\to 0^{+}}\frac{\mathrm{e}^{x}-1}{x}\right]=\sqrt{2}\left(\mathrm{e}^{-1}-1\right).$$
