      #### 基础篇 第14章 (15)-(1) 设平面区域 $D=\left\{(x,y)\mid 2x^{2}+y^{2}\leqslant 2\sqrt{x^{2}+y^{2}},y\geqslant x\geqslant 0\right\}$，若 $\displaystyle\iint_{D}\frac{f(x,y)}{\sqrt{1-x^{2}}}\mathrm{d}\sigma=a>0$，$f(x,y)$ 是 $D$ 上的连续函数．计算 $\displaystyle\iint_{D}\frac{1}{\sqrt{1-x^{2}}}\mathrm{d}\sigma$．
    back: |
      【解析】$2x^{2}+y^{2}=2\sqrt{x^{2}+y^{2}}$ 在极坐标系下为 $r(1+\cos^{2}\theta)=2$．则

      $$\iint_{D}\frac{1}{\sqrt{1-x^{2}}}\mathrm{d}\sigma=\int_{\frac{\pi}{4}}^{\frac{\pi}{2}}\mathrm{d}\theta\int_{0}^{\frac{2}{1+\cos^{2}\theta}}\frac{1}{\sqrt{1-r^{2}\cos^{2}\theta}}r\,\mathrm{d}r=2\int_{\frac{\pi}{4}}^{\frac{\pi}{2}}\frac{1}{1+\cos^{2}\theta}\mathrm{d}\theta$$

      $$=2\int_{\frac{\pi}{4}}^{\frac{\pi}{2}}\frac{\sec^{2}\theta}{\sec^{2}\theta+1}\mathrm{d}\theta=2\int_{\frac{\pi}{4}}^{\frac{\pi}{2}}\frac{\mathrm{d}(\tan\theta)}{2+\tan^{2}\theta}$$

      $$\xlongequal{u=\tan\theta}2\int_{1}^{+\infty}\frac{\mathrm{d}u}{2+u^{2}}=\sqrt{2}\arctan\frac{u}{\sqrt{2}}\bigg|_{1}^{+\infty}=\sqrt{2}\cdot\left(\frac{\pi}{2}-\arctan\frac{\sqrt{2}}{2}\right)$$

      $$=\frac{\sqrt{2}}{2}\pi-\sqrt{2}\arctan\frac{\sqrt{2}}{2}.$$
  - front: |
      #### 基础篇 第14章 (15)-(2) 设平面区域 $D=\left\{(x,y)\mid 2x^{2}+y^{2}\leqslant 2\sqrt{x^{2}+y^{2}},y\geqslant x\geqslant 0\right\}$，若 $\displaystyle\iint_{D}\frac{f(x,y)}{\sqrt{1-x^{2}}}\mathrm{d}\sigma=a>0$，$f(x,y)$ 是 $D$ 上的连续函数．证明：存在 $(\xi,\eta)\in D$，使得 $|f(\xi,\eta)|\geqslant\dfrac{\sqrt{2}}{\pi}a$．
    back: |
      【解析】由**积分保号性**可得，

      $$a=\iint_{D}\frac{f(x,y)}{\sqrt{1-x^{2}}}\mathrm{d}\sigma=\left|\iint_{D}\frac{f(x,y)}{\sqrt{1-x^{2}}}\mathrm{d}\sigma\right|\leqslant\iint_{D}\frac{|f(x,y)|}{\sqrt{1-x^{2}}}\mathrm{d}\sigma$$

      $$\xlongequal{积分中值定理}|f(\xi,\eta)|\iint_{D}\frac{1}{\sqrt{1-x^{2}}}\mathrm{d}\sigma$$

      $$=\left(\frac{\sqrt{2}}{2}\pi-\sqrt{2}\arctan\frac{\sqrt{2}}{2}\right)|f(\xi,\eta)|\quad ((\xi,\eta)\in D),$$

      即存在 $(\xi,\eta)\in D$，使得 $a\leqslant\left(\dfrac{\sqrt{2}}{2}\pi-\sqrt{2}\arctan\dfrac{\sqrt{2}}{2}\right)|f(\xi,\eta)|$，即

      $$|f(\xi,\eta)|\geqslant\frac{a}{\dfrac{\sqrt{2}}{2}\pi-\sqrt{2}\arctan\dfrac{\sqrt{2}}{2}}\geqslant\frac{a}{\dfrac{\sqrt{2}}{2}\pi}=\frac{\sqrt{2}}{\pi}a.$$
