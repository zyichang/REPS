      #### 强化篇 第1章 (6) 计算 $\lim\limits_{x\to+\infty}\left(\dfrac{\pi}{2}-\arctan x\right)^{\frac{1}{\ln x}}$．
    back: |
      【解析】取对数得

      $$\lim_{x\to+\infty}\frac{\ln\left(\frac{\pi}{2}-\arctan x\right)}{\ln x}\xlongequal{\text{洛必达法则}}\lim_{x\to+\infty}x\cdot\frac{-\frac{1}{1+x^{2}}}{\frac{\pi}{2}-\arctan x}=\lim_{x\to+\infty}\frac{\frac{x}{1+x^{2}}}{\arctan x-\frac{\pi}{2}}$$

      $$\xlongequal{\text{洛必达法则}}\lim_{x\to+\infty}(1+x^{2})\cdot\frac{1-x^{2}}{(1+x^{2})^{2}}=-1,$$

      故 $\lim\limits_{x\to+\infty}\left(\dfrac{\pi}{2}-\arctan x\right)^{\frac{1}{\ln x}}=\dfrac{1}{\mathrm{e}}$．
