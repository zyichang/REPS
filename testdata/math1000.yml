      #### 基础篇 第14章 (3) 设 $x\geqslant 0$，$y\geqslant 0$，曲线 $l_{1}:x^{2}+y^{2}-xy=1$，$l_{2}:x^{2}+y^{2}-xy=2$，直线 $l_{3}:y=\dfrac{\sqrt{3}}{3}x$，$l_{4}:y=\sqrt{3}x$．区域 $D_{1}$ 由 $l_{1},l_{2},x=0,y=0$ 围成，$D_{2}$ 由 $l_{1},l_{2},l_{3},y=0$ 围成，$D_{3}$ 由 $l_{1},l_{2},l_{4},x=0$ 围成，则对于 $I_{i}=\displaystyle\iint_{D_{i}}\sqrt[3]{y-x}\,\mathrm{d}\sigma\ (i=1,2,3)$，有（　）．

      ;;;
      A. $I_{1}<I_{2}<I_{3}$
      B. $I_{3}<I_{1}<I_{2}$
      C. $I_{2}<I_{3}<I_{1}$
      D. $I_{2}<I_{1}<I_{3}$
      ;;;D
    back: |
      【答案】(D)

      【解析】由于区域 $D_{1}$ 关于 $y=x$ 对称，由**轮换对称性**得

      $$I_{1}=\iint_{D_{1}}\sqrt[3]{x-y}\,\mathrm{d}\sigma=\iint_{D_{1}}\sqrt[3]{y-x}\,\mathrm{d}\sigma,$$

      故 $I_{1}=0$．

      由于 $D_{2}$ 在 $y=x$ 的下侧，故 $y<x$，则 $\sqrt[3]{y-x}<0$；由于 $D_{3}$ 在 $y=x$ 的上侧，故 $y>x$，则 $\sqrt[3]{y-x}>0$．根据积分的**保号性**知，$I_{2}<0$，$I_{3}>0$．

      综上，$I_{2}<I_{1}<I_{3}$．
