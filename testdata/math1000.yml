      #### 基础篇 第5章 (3) 设函数 $f(x)=\begin{cases}\cos|x|-1,&x\leqslant 0,\\ x\ln x,&x>0,\end{cases}$ 则 $x=0$ 是 $f(x)$ 的（　）．

      ;;;
      A. 可导点，极值点
      B. 不可导点，极值点
      C. 可导点，非极值点
      D. 不可导点，非极值点
      ;;;B
    back: |
      【答案】(B)

      【解析】当 $x<0$ 时，$f(x)=\cos(-x)-1=\cos x-1$，所以有

      $$\lim_{x\to 0^{-}}\frac{f(x)-f(0)}{x}=\lim_{x\to 0^{-}}\frac{\cos x-1}{x}=\lim_{x\to 0^{-}}\frac{-\dfrac{1}{2}x^{2}}{x}=0,$$

      $$\lim_{x\to 0^{+}}\frac{f(x)-f(0)}{x}=\lim_{x\to 0^{+}}\frac{x\ln x}{x}=-\infty,$$

      故 $f(x)$ 在 $x=0$ 处的右导数不存在，从而 $f(x)$ 在 $x=0$ 处**不可导**．

      当 $-\dfrac{\pi}{2}<x<0$ 时，$f'(x)=-\sin x>0$，当 $0<x<\mathrm{e}^{-1}$ 时，$f'(x)=\ln x+1<0$，且 $f(x)$ 在 $x=0$ 处连续，所以 $x=0$ 是 $f(x)$ 的**极大值点**．
