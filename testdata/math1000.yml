      #### 强化篇 第1章 (13) $\lim\limits_{x\to 0}\left(\dfrac{\arcsin x}{x}\right)^{\frac{1}{\sin^{2}x}}=$ ________．
    back: |
      【答案】$\mathrm{e}^{\frac{1}{6}}$

      【解析】

      $$\lim_{x\to 0}\left(\frac{\arcsin x}{x}\right)^{\frac{1}{\sin^{2}x}}=\lim_{x\to 0}\left(1+\frac{\arcsin x-x}{x}\right)^{\frac{1}{\sin^{2}x}}=\exp\left\{\lim_{x\to 0}\frac{\arcsin x-x}{x\sin^{2}x}\right\},$$

      其中

      $$\lim_{x\to 0}\frac{\arcsin x-x}{x\sin^{2}x}=\lim_{x\to 0}\frac{\arcsin x-x}{x^{3}}=\lim_{x\to 0}\frac{\frac{1}{\sqrt{1-x^{2}}}-1}{3x^{2}}=\lim_{x\to 0}\frac{1-\sqrt{1-x^{2}}}{3x^{2}\sqrt{1-x^{2}}}=\lim_{x\to 0}\frac{\frac{1}{2}x^{2}}{3x^{2}\sqrt{1-x^{2}}}=\frac{1}{6}.$$

      故 $\lim\limits_{x\to 0}\left(\dfrac{\arcsin x}{x}\right)^{\frac{1}{\sin^{2}x}}=\mathrm{e}^{\frac{1}{6}}$．
