      #### 基础篇 第14章 (5) 已知曲线 $L$ 的极坐标方程为 $r=\sin 3\theta\ \left(0\leqslant\theta\leqslant\dfrac{\pi}{3}\right)$，$D$ 为曲线 $L$ 围成的区域，则 $\displaystyle\iint_{D}\sqrt{x^{2}+y^{2}}\,\mathrm{d}x\mathrm{d}y=$ ________．
    back: |
      【答案】$\dfrac{4}{27}$

      【解析】

      $$\iint_{D}\sqrt{x^{2}+y^{2}}\,\mathrm{d}x\mathrm{d}y=\int_{0}^{\frac{\pi}{3}}\mathrm{d}\theta\int_{0}^{\sin 3\theta}\sqrt{r^{2}\cos^{2}\theta+r^{2}\sin^{2}\theta}\cdot r\,\mathrm{d}r$$

      $$=\int_{0}^{\frac{\pi}{3}}\mathrm{d}\theta\int_{0}^{\sin 3\theta}r^{2}\,\mathrm{d}r=\frac{1}{3}\int_{0}^{\frac{\pi}{3}}\sin^{3}3\theta\,\mathrm{d}\theta$$

      $$=\frac{1}{9}\int_{0}^{\pi}\sin^{3}t\,\mathrm{d}t=\frac{2}{9}\int_{0}^{\frac{\pi}{2}}\sin^{3}t\,\mathrm{d}t=\frac{2}{9}\cdot\frac{2}{3}=\frac{4}{27}.$$
