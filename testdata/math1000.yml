      【解析】**方法一**

      $$\int\frac{\mathrm{e}^{2x}}{\sqrt{\mathrm{e}^{x}-1}}\mathrm{d}x=\int\frac{\mathrm{e}^{x}}{\sqrt{\mathrm{e}^{x}-1}}\mathrm{d}(\mathrm{e}^{x})=\int\frac{\mathrm{e}^{x}-1+1}{\sqrt{\mathrm{e}^{x}-1}}\mathrm{d}(\mathrm{e}^{x})$$

      $$=\int\left(\sqrt{\mathrm{e}^{x}-1}+\frac{1}{\sqrt{\mathrm{e}^{x}-1}}\right)\mathrm{d}(\mathrm{e}^{x}-1)=\frac{2}{3}(\mathrm{e}^{x}-1)^{\frac{3}{2}}+2\sqrt{\mathrm{e}^{x}-1}+C.$$

      **方法二**　令 $t=\sqrt{\mathrm{e}^{x}-1}$，则 $t^{2}=\mathrm{e}^{x}-1$，$x=\ln(t^{2}+1)$，$\mathrm{e}^{2x}=(t^{2}+1)^{2}$，故

      $$原式=\int\frac{(t^{2}+1)^{2}}{t}\cdot\frac{2t}{t^{2}+1}\mathrm{d}t=\int(2t^{2}+2)\mathrm{d}t=\frac{2}{3}t^{3}+2t+C=\frac{2}{3}(\mathrm{e}^{x}-1)^{\frac{3}{2}}+2\sqrt{\mathrm{e}^{x}-1}+C.$$
