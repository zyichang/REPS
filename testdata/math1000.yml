      #### 基础篇 第9章 (3) 计算不定积分 $\displaystyle\int\ln\left(1+\sqrt{\frac{1+x}{x}}\right)\mathrm{d}x\ (x>0)$．
    back: |
      【解析】令 $\sqrt{\dfrac{1+x}{x}}=t$，则 $x=\dfrac{1}{t^{2}-1}$，于是

      $$\int\ln\left(1+\sqrt{\frac{1+x}{x}}\right)\mathrm{d}x=\int\ln(1+t)\mathrm{d}\left(\frac{1}{t^{2}-1}\right)=\frac{\ln(1+t)}{t^{2}-1}-\int\frac{1}{t^{2}-1}\cdot\frac{1}{t+1}\mathrm{d}t,$$

      又

      $$\int\frac{1}{(t^{2}-1)(t+1)}\mathrm{d}t=\frac{1}{4}\int\left[\frac{1}{t-1}-\frac{1}{t+1}-\frac{2}{(t+1)^{2}}\right]\mathrm{d}t=\frac{1}{4}\ln(t-1)-\frac{1}{4}\ln(t+1)+\frac{1}{2(t+1)}+C_{1},$$

      所以

      $$\int\ln\left(1+\sqrt{\frac{1+x}{x}}\right)\mathrm{d}x=\frac{\ln(1+t)}{t^{2}-1}+\frac{1}{4}\ln\frac{t+1}{t-1}-\frac{1}{2(t+1)}+C$$

      $$=x\ln\left(1+\sqrt{\frac{1+x}{x}}\right)+\frac{1}{2}\ln\left(\sqrt{1+x}+\sqrt{x}\right)-\frac{\sqrt{x}}{2\left(\sqrt{1+x}+\sqrt{x}\right)}+C.$$
