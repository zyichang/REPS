      #### 强化篇 第1章 (38) 若 $f'(x)=1+x^{2}+x^{3}+o(x^{3})\ (x\to 0)$，$g(x)=\begin{cases}\dfrac{x}{f(x)-f(0)},&x\neq 0,\\[2mm]a,&x=0,\end{cases}$ 且 $g(x)$ 连续．

      （1）求 $a$ 的值；\
      （2）当 $x\to 0$ 时，计算 $g(x)$ 到 $3$ 阶的带佩亚诺余项的泰勒公式．
    back: |
      【解析】（1）$\lim\limits_{x\to 0}g(x)=\dfrac{1}{f'(0)}=1$，故当 $a=1$ 时，$g(x)$ 连续．

      （2）由于 $f'(x)=1+x^{2}+x^{3}+o(x^{3})\ (x\to 0)$，则

      $$f(x)-f(0)=\int_{0}^{x}f'(t)\mathrm{d}t=\int_{0}^{x}\left[1+t^{2}+t^{3}+o(t^{3})\right]\mathrm{d}t=x+\frac{1}{3}x^{3}+\frac{1}{4}x^{4}+o(x^{4})\ (x\to 0).$$

      当 $x\to 0$ 时，

      $$g(x)=\frac{1}{1+\frac{1}{3}x^{2}+\frac{1}{4}x^{3}+o(x^{3})}=\left[1+\frac{1}{3}x^{2}+\frac{1}{4}x^{3}+o(x^{3})\right]^{-1}$$

      $$=1+(-1)\left[\frac{1}{3}x^{2}+\frac{1}{4}x^{3}+o(x^{3})\right]+o(x^{3})=1-\frac{1}{3}x^{2}-\frac{1}{4}x^{3}+o(x^{3}).$$
