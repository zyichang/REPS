      ①$\alpha(x)+\beta(x)=2\alpha(x)$；　②$\alpha(x)+\beta(x)=2\beta(x)$；\
      ③$\alpha(x)-\beta(x)=o(\alpha(x))$；　④$\alpha(x)-\beta(x)=o(\beta(x))$．

      所有正确结论的序号是（　）．

      ;;;
      (A) ①③
      (B) ③④
      (C) ①②③④
      (D) ②④
      ;;;B
    back: |
      【答案】(B)

      【解析】由 $\alpha(x)$ 与 $\beta(x)$ 是非零且不相等的等价无穷小量，得 $\lim\limits_{x\to 0}\dfrac{\alpha(x)}{\beta(x)}=1$，$\lim\limits_{x\to 0}\dfrac{\beta(x)}{\alpha(x)}=1$，$\alpha(x)\neq 0$，$\beta(x)\neq 0$ 且 $\alpha(x)\neq\beta(x)$，从而

      $$\lim_{x\to 0}\frac{\alpha(x)+\beta(x)}{\alpha(x)}=\lim_{x\to 0}\frac{\alpha(x)}{\alpha(x)}+\lim_{x\to 0}\frac{\beta(x)}{\alpha(x)}=1+1=2,$$

      故 $\alpha(x)+\beta(x)\sim 2\alpha(x)$，不是“$=$”，① 错误；

      同理，$\alpha(x)+\beta(x)\sim 2\beta(x)$，从而 ② 错误；

      $$\lim_{x\to 0}\frac{\alpha(x)-\beta(x)}{\alpha(x)}=\lim_{x\to 0}\frac{\alpha(x)}{\alpha(x)}-\lim_{x\to 0}\frac{\beta(x)}{\alpha(x)}=1-1=0,$$

      ③ 正确；

      $$\lim_{x\to 0}\frac{\alpha(x)-\beta(x)}{\beta(x)}=\lim_{x\to 0}\frac{\alpha(x)}{\beta(x)}-\lim_{x\to 0}\frac{\beta(x)}{\beta(x)}=1-1=0,$$

      ④ 正确．
