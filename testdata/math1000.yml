      #### 基础篇 第5章 (2) 若函数 $f(x)=\mathrm{e}^{-ax}-\mathrm{e}x$ 的极值点小于零，则常数 $a$ 的取值范围为 ________．
    back: |
      【答案】$(-\infty,-\mathrm{e})$

      【解析】$f'(x)=(-a)\cdot\mathrm{e}^{-ax}-\mathrm{e}\xlongequal{\text{令}}0$，得驻点 $x=x_{0}$ 满足 $-a\mathrm{e}^{-ax_{0}}-\mathrm{e}=0$，即 $a=-\mathrm{e}^{1+ax_{0}}<0$，又 $x_{0}<0$，于是 $1+ax_{0}>1$，又因为 $-\mathrm{e}^{u}$ 为单调减函数，所以 $a<-\mathrm{e}$．综上，$a\in(-\infty,-\mathrm{e})$．

      【注】若命制为极值点大于零，则 $a\in(-\mathrm{e},0)$．
