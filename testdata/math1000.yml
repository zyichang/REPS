      【答案】(A)

      【解析】在 $g(x)=\displaystyle\int_{0}^{2x}f\left(x+\frac{t}{2}\right)\mathrm{d}t$ 中，令 $x+\dfrac{t}{2}=u$，则

      $$g(x)=\int_{0}^{2x}f\left(x+\frac{t}{2}\right)\mathrm{d}t=2\int_{x}^{2x}f(u)\mathrm{d}u,$$

      $$\lim_{x\to 0^{+}}\frac{g(x)}{\sqrt{x}}=\lim_{x\to 0^{+}}\frac{2\displaystyle\int_{x}^{2x}f(u)\mathrm{d}u}{\sqrt{x}}\xlongequal{洛必达法则}2\lim_{x\to 0^{+}}\frac{2f(2x)-f(x)}{\dfrac{1}{2\sqrt{x}}}=4\lim_{x\to 0^{+}}\sqrt{x}\left[2f(2x)-f(x)\right]=0,$$

      这表明当 $x\to 0^{+}$ 时，$g(x)$ 是 $\sqrt{x}$ 的**高阶无穷小**．

      故正确选项为 (A)．
