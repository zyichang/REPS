      #### 基础篇 第9章 (1)-(14) 计算不定积分 $\displaystyle\int\csc^{3}x\,\mathrm{d}x$．
    back: |
      【解析】

      $$\int\csc^{3}x\,\mathrm{d}x=\int\csc^{2}x\csc x\,\mathrm{d}x=-\int\csc x\,\mathrm{d}(\cot x)$$

      $$=-\csc x\cot x+\int\cot x\,\mathrm{d}(\csc x)=-\csc x\cot x-\int\cot^{2}x\csc x\,\mathrm{d}x$$

      $$=-\csc x\cot x-\int\csc x(\csc^{2}x-1)\mathrm{d}x=-\csc x\cot x-\int\csc^{3}x\,\mathrm{d}x+\int\csc x\,\mathrm{d}x,$$

      $$\int\csc x\,\mathrm{d}x=\int\frac{\csc x(\csc x-\cot x)}{\csc x-\cot x}\mathrm{d}x=\int\frac{\mathrm{d}(\csc x-\cot x)}{\csc x-\cot x}=\ln|\csc x-\cot x|+C_{1},$$

      故

      $$\int\csc^{3}x\,\mathrm{d}x=\frac{1}{2}\left(-\csc x\cot x+\ln|\csc x-\cot x|+C_{1}\right)=-\frac{1}{2}\csc x\cot x+\frac{1}{2}\ln|\csc x-\cot x|+C.$$
