      $$\lim_{x\to 0}\frac{1}{\tan kx}\left(\frac{1-\sin x}{1+\sin x}-1\right)=\lim_{x\to 0}\frac{1}{\tan kx}\left(\frac{1-\sin x-1-\sin x}{1+\sin x}\right)=\lim_{x\to 0}\frac{-2\sin x}{\tan kx}=-\frac{2}{k},$$

