      #### 基础篇 第14章 (8) 设平面区域 $D=\{(x,y)\mid 1\leqslant x^{2}+y^{2}\leqslant 4,x\geqslant 0,y\geqslant 0\}$，计算 $\displaystyle\iint_{D}\frac{x\cos\sqrt{x^{2}+y^{2}}}{x+y}\mathrm{d}x\mathrm{d}y$．
    back: |
      【解析】由**轮换对称性**，得

      $$\iint_{D}\frac{x\cos\sqrt{x^{2}+y^{2}}}{x+y}\mathrm{d}x\mathrm{d}y=\iint_{D}\frac{y\cos\sqrt{x^{2}+y^{2}}}{x+y}\mathrm{d}x\mathrm{d}y$$

      $$=\frac{1}{2}\iint_{D}\cos\sqrt{x^{2}+y^{2}}\,\mathrm{d}x\mathrm{d}y=\frac{1}{2}\int_{0}^{\frac{\pi}{2}}\mathrm{d}\theta\int_{1}^{2}r\cos r\,\mathrm{d}r$$

      $$=\frac{\pi}{4}(2\sin 2+\cos 2-\sin 1-\cos 1).$$
  - front: |
      #### 基础篇 第14章 (9) 设 $D$ 是由 $y=|x|$ 及 $y=1$ 围成的有界区域，计算二重积分 $\displaystyle\iint_{D}\frac{x^{2}-x\cos y-y^{2}}{x^{2}+y^{2}}\mathrm{d}x\mathrm{d}y$．
    back: |
      【解析】由**对称性**，得

      $$\iint_{D}\frac{x^{2}-x\cos y-y^{2}}{x^{2}+y^{2}}\mathrm{d}x\mathrm{d}y=\iint_{D}\frac{x^{2}-y^{2}}{x^{2}+y^{2}}\mathrm{d}x\mathrm{d}y=2\int_{\frac{\pi}{4}}^{\frac{\pi}{2}}\mathrm{d}\theta\int_{0}^{\frac{1}{\sin\theta}}\frac{r^{2}\cos^{2}\theta-r^{2}\sin^{2}\theta}{r^{2}}r\,\mathrm{d}r$$

      $$=\int_{\frac{\pi}{4}}^{\frac{\pi}{2}}(\cos^{2}\theta-\sin^{2}\theta)\frac{1}{\sin^{2}\theta}\mathrm{d}\theta=\int_{\frac{\pi}{4}}^{\frac{\pi}{2}}\cot^{2}\theta\,\mathrm{d}\theta-\int_{\frac{\pi}{4}}^{\frac{\pi}{2}}1\,\mathrm{d}\theta$$

      $$=\int_{\frac{\pi}{4}}^{\frac{\pi}{2}}\csc^{2}\theta\,\mathrm{d}\theta-\int_{\frac{\pi}{4}}^{\frac{\pi}{2}}2\,\mathrm{d}\theta=-\cot\theta\bigg|_{\frac{\pi}{4}}^{\frac{\pi}{2}}-\frac{\pi}{2}=1-\frac{\pi}{2}.$$
