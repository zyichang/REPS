      对于 (B) 选项，$\ln(1+x^{2})\sim x^{2}$，$\sqrt{\cos^{3}x}\to 1$，则有 $\displaystyle\int_{0}^{\ln(1+x^{2})}\sqrt{\cos^{3}t}\,\mathrm{d}t\sim\int_{0}^{x^{2}}1\mathrm{d}t=x^{2}$；

