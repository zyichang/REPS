      #### 强化篇 第1章 (4) 计算 $\lim\limits_{x\to 0}\dfrac{\sqrt{1+\tan x}-\sqrt{1+\sin x}}{x\ln(1+x)-x^{2}}$．
    back: |
      【解析】分子有理化，

      $$\lim_{x\to 0}\frac{\sqrt{1+\tan x}-\sqrt{1+\sin x}}{x\ln(1+x)-x^{2}}=\frac{1}{2}\lim_{x\to 0}\frac{\tan x-\sin x}{x\ln(1+x)-x^{2}}=-\frac{1}{2}\lim_{x\to 0}\frac{\frac{1}{2}x^{3}+o(x^{3})}{\frac{1}{2}x^{3}+o(x^{3})}=-\frac{1}{2}.$$
