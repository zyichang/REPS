      【答案】(A)

      【解析】因为 $x=0$ 是函数 $f(x)$ 的第一类间断点，且 $f(x)$ 在 $x=0$ 处无定义，故 $f(x)$ 的左、右极限均存在．又 $\lim\limits_{x\to 0}f(x)=\lim\limits_{x\to 0}\dfrac{\displaystyle\int_{0}^{x}\mathrm{e}^{t^{2}}\mathrm{d}t+ax}{x-b\sin x}$ 为“$\dfrac{0}{0}$”型，故由洛必达法则得 $\lim\limits_{x\to 0}f(x)=\lim\limits_{x\to 0}\dfrac{\mathrm{e}^{x^{2}}+a}{1-b\cos x}$．

      选项 (A)，当 $a=1$，$b=1$ 时，$\lim\limits_{x\to 0}f(x)=\lim\limits_{x\to 0}\dfrac{\mathrm{e}^{x^{2}}+1}{1-\cos x}=\infty$，与 $x=0$ 是 $f(x)$ 的第一类间断点矛盾．

      选项 (B)，当 $a=-1$，$b=1$ 时，$\lim\limits_{x\to 0}f(x)=\lim\limits_{x\to 0}\dfrac{\mathrm{e}^{x^{2}}-1}{1-\cos x}=\lim\limits_{x\to 0}\dfrac{x^{2}}{\frac{1}{2}x^{2}}=2$．

      选项 (C)，当 $a=1$，$b=-1$ 时，$\lim\limits_{x\to 0}f(x)=\lim\limits_{x\to 0}\dfrac{\mathrm{e}^{x^{2}}+1}{1+\cos x}=\dfrac{2}{2}=1$．

      选项 (D)，当 $a=-1$，$b=-1$ 时，$\lim\limits_{x\to 0}f(x)=\lim\limits_{x\to 0}\dfrac{\mathrm{e}^{x^{2}}-1}{1+\cos x}=0$．
