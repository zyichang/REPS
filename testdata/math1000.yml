      【答案】$\mathrm{e}^{-3}$

      【解析】当 $n\geqslant 2$ 时，因为

      $$a_{n}=\int_{0}^{1}x^{n}\sqrt{1-x^{2}}\,\mathrm{d}x=-\left.\frac{1}{3}x^{n-1}(1-x^{2})^{\frac{3}{2}}\right|_{0}^{1}+\frac{n-1}{3}\int_{0}^{1}x^{n-2}(1-x^{2})^{\frac{3}{2}}\mathrm{d}x$$

      $$=\frac{n-1}{3}\int_{0}^{1}x^{n-2}\sqrt{1-x^{2}}\,\mathrm{d}x-\frac{n-1}{3}\int_{0}^{1}x^{n}\sqrt{1-x^{2}}\,\mathrm{d}x=\frac{n-1}{3}a_{n-2}-\frac{n-1}{3}a_{n},$$

      所以 $a_{n}=\dfrac{n-1}{n+2}a_{n-2}\ (n=2,3,\cdots)$，故

      $$\lim_{n\to\infty}\left(\frac{a_{n}}{a_{n-2}}\right)^{n}=\lim_{n\to\infty}\left(\frac{n-1}{n+2}\right)^{n}=\lim_{n\to\infty}\left(1+\frac{-3}{n+2}\right)^{n}=\mathrm{e}^{-3}.$$
