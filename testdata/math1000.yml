      【答案】$\dfrac{1}{9}\left(1-2\sqrt{2}\right)$

      【解析】**方法一**　由 $f(x)=\displaystyle\int_{1}^{x}\sqrt{1+t^{3}}\,\mathrm{d}t$，可得 $f'(x)=\sqrt{1+x^{3}}$，且 $f(1)=0$，从而

      $$\int_{0}^{1}xf(x)\mathrm{d}x=\frac{1}{2}\int_{0}^{1}f(x)\mathrm{d}(x^{2})=\frac{1}{2}\left[\left.x^{2}f(x)\right|_{0}^{1}-\int_{0}^{1}x^{2}f'(x)\mathrm{d}x\right]$$

      $$=-\frac{1}{2}\int_{0}^{1}x^{2}\sqrt{1+x^{3}}\,\mathrm{d}x=-\frac{1}{2}\cdot\left.\frac{2}{9}(1+x^{3})^{\frac{3}{2}}\right|_{0}^{1}=\frac{1}{9}\left(1-2\sqrt{2}\right).$$

      **方法二**（此方法学完二重积分再看）　将 $f(x)=\displaystyle\int_{1}^{x}\sqrt{1+t^{3}}\,\mathrm{d}t$ 代入所求表达式，有

      $$\int_{0}^{1}xf(x)\mathrm{d}x=-\int_{0}^{1}x\mathrm{d}x\int_{x}^{1}\sqrt{1+t^{3}}\,\mathrm{d}t,$$

      交换积分次序并计算得

      $$\int_{0}^{1}xf(x)\mathrm{d}x=-\int_{0}^{1}\sqrt{1+t^{3}}\,\mathrm{d}t\int_{0}^{t}x\mathrm{d}x=-\frac{1}{2}\int_{0}^{1}t^{2}\sqrt{1+t^{3}}\,\mathrm{d}t=-\frac{1}{2}\cdot\left.\frac{2}{9}(1+t^{3})^{\frac{3}{2}}\right|_{0}^{1}=\frac{1}{9}\left(1-2\sqrt{2}\right).$$
