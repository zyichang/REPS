      #### 基础篇 第14章 (6) 已知平面区域 $D=\{(x,y)\mid |x|\leqslant y,(x^{2}+y^{2})^{3}\leqslant y^{4}\}$，则 $\displaystyle\iint_{D}\frac{|x|}{\sqrt{x^{2}+y^{2}}}\mathrm{d}x\mathrm{d}y=$ ________．
    back: |
      【答案】$\dfrac{1}{5}\left(1-\dfrac{\sqrt{2}}{8}\right)$

      【解析】因为 $D$ 关于 $y$ 轴对称，所以

      $$\iint_{D}\frac{|x|}{\sqrt{x^{2}+y^{2}}}\mathrm{d}x\mathrm{d}y=2\iint_{D_{1}}\frac{x}{\sqrt{x^{2}+y^{2}}}\mathrm{d}x\mathrm{d}y,$$

      其中 $D_{1}$ 是 $D$ 位于 $y$ 轴右侧的部分．

      在极坐标系中，$D_{1}=\left\{(r,\theta)\ \bigg|\ \dfrac{\pi}{4}\leqslant\theta\leqslant\dfrac{\pi}{2},0\leqslant r\leqslant\sin^{2}\theta\right\}$，所以

      $$\iint_{D}\frac{|x|}{\sqrt{x^{2}+y^{2}}}\mathrm{d}x\mathrm{d}y=2\int_{\frac{\pi}{4}}^{\frac{\pi}{2}}\mathrm{d}\theta\int_{0}^{\sin^{2}\theta}r\cos\theta\,\mathrm{d}r=\int_{\frac{\pi}{4}}^{\frac{\pi}{2}}\sin^{4}\theta\,\mathrm{d}(\sin\theta)$$

      $$=\frac{1}{5}\sin^{5}\theta\bigg|_{\frac{\pi}{4}}^{\frac{\pi}{2}}=\frac{1}{5}\left(1-\frac{\sqrt{2}}{8}\right).$$
