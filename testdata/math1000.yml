      #### 强化篇 第1章 (44) 已知 $x=0$ 是函数 $f(x)=\dfrac{\displaystyle\int_{0}^{x}\mathrm{e}^{t^{2}}\mathrm{d}t+ax}{x-b\sin x}$ 的第一类间断点，则 $(a,b)$ 取值不可以是（　）．

