      【答案】(B)

      【解析】$f(x)=\dfrac{\left(\mathrm{e}^{\frac{1}{x-1}}-1\right)|x|}{(x+1)\ln|x-1|}$ 的间断点为 $x=-1,1,0,2$．

      对于 $x=-1$，$\lim\limits_{x\to-1}f(x)=\lim\limits_{x\to-1}\dfrac{\mathrm{e}^{-\frac{1}{2}}-1}{(x+1)\ln 2}=\infty$．从而 $x=-1$ 是无穷间断点．

      对于 $x=2$，$\lim\limits_{x\to 2}f(x)=\lim\limits_{x\to 2}\dfrac{2(\mathrm{e}-1)}{3\ln|x-1|}=\infty$．从而 $x=2$ 是无穷间断点．

      对于 $x=0$，$\lim\limits_{x\to 0}f(x)=\lim\limits_{x\to 0}\dfrac{\left(\mathrm{e}^{-1}-1\right)|x|}{\ln(1-x)}=\lim\limits_{x\to 0}\dfrac{\left(\mathrm{e}^{-1}-1\right)|x|}{-x}$．显然 $x=0$ 是 $f(x)$ 的跳跃间断点．

      对于 $x=1$，$\lim\limits_{x\to 1^{+}}f(x)=\lim\limits_{x\to 1^{+}}\dfrac{\mathrm{e}^{\frac{1}{x-1}}-1}{2\ln(x-1)}\xlongequal{u=\frac{1}{x-1}}\lim\limits_{u\to+\infty}\dfrac{\mathrm{e}^{u}-1}{-2\ln u}=\infty$．从而 $x=1$ 是无穷间断点．

      故 $f(x)$ 的第一类间断点为 $x=0$，仅有 $1$ 个．
