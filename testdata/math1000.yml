      #### 基础篇 第14章 (4) 已知函数 $f(t)=\displaystyle\int_{1}^{t^{2}}\mathrm{d}x\int_{t}^{\sqrt{x}}\sin\frac{x}{y}\mathrm{d}y$，则 $f'\left(\dfrac{\pi}{2}\right)=$ ________．
    back: |
      【答案】$-\dfrac{\pi}{2}\cos\dfrac{2}{\pi}$

      【解析】当 $t>1$ 时，设区域

      $$D=\{(x,y)\mid 1\leqslant x\leqslant t^{2},\sqrt{x}\leqslant y\leqslant t\},$$

      从而

      $$f(t)=-\int_{1}^{t^{2}}\mathrm{d}x\int_{\sqrt{x}}^{t}\sin\frac{x}{y}\mathrm{d}y=-\iint_{D}\sin\frac{x}{y}\mathrm{d}x\mathrm{d}y.$$

      将二重积分写为先对 $x$、后对 $y$ 的累次积分，有

      $$f(t)=-\int_{1}^{t}\mathrm{d}y\int_{1}^{y^{2}}\sin\frac{x}{y}\mathrm{d}x=-\int_{1}^{t}y\left(\cos\frac{1}{y}-\cos y\right)\mathrm{d}y,$$

      所以

      $$f'(t)=-t\left(\cos\frac{1}{t}-\cos t\right),\quad t>1,$$

      从而

      $$f'\left(\frac{\pi}{2}\right)=-\frac{\pi}{2}\cos\frac{2}{\pi}.$$
