      #### 基础篇 第9章 (13) 设 $f(x)$ 在 $x=0$ 的某邻域内连续，在 $x=0$ 可导，且 $f(0)=0$，$\varphi(x)=\begin{cases}\dfrac{1}{x^{2}}\displaystyle\int_{0}^{x}tf(t)\mathrm{d}t, & x\neq 0,\\ 0, & x=0,\end{cases}$ 则 $\varphi(x)$ 在 $x=0$ 处（　）．

      ;;;
      A. 不连续
      B. 连续但不可导
      C. 可导但 $\varphi'(x)$ 在 $x=0$ 处不连续
      D. 可导且 $\varphi'(x)$ 在 $x=0$ 处连续
      ;;;D
    back: |
      【答案】(D)

      【解析】

      $$\lim_{x\to 0}\varphi(x)=\lim_{x\to 0}\frac{\displaystyle\int_{0}^{x}tf(t)\mathrm{d}t}{x^{2}}\xlongequal{洛必达法则}\lim_{x\to 0}\frac{xf(x)}{2x}=\frac{1}{2}f(0)=0=\varphi(0),$$

      因此 $\varphi(x)$ 在 $x=0$ 处连续．

      当 $x\neq 0$ 时，

      $$\varphi'(x)=\frac{x^{3}f(x)-2x\displaystyle\int_{0}^{x}tf(t)\mathrm{d}t}{x^{4}}=\frac{f(x)}{x}-\frac{2\displaystyle\int_{0}^{x}tf(t)\mathrm{d}t}{x^{3}};$$

      当 $x=0$ 时，

      $$\varphi'(0)=\lim_{x\to 0}\frac{\varphi(x)-\varphi(0)}{x-0}=\lim_{x\to 0}\frac{\displaystyle\int_{0}^{x}tf(t)\mathrm{d}t}{x^{3}}=\lim_{x\to 0}\frac{xf(x)}{3x^{2}}=\frac{1}{3}\lim_{x\to 0}\frac{f(x)}{x}=\frac{1}{3}\lim_{x\to 0}\frac{f(x)-f(0)}{x}=\frac{1}{3}f'(0).$$

      $$\lim_{x\to 0}\varphi'(x)=\lim_{x\to 0}\frac{f(x)}{x}-\lim_{x\to 0}\frac{2\displaystyle\int_{0}^{x}tf(t)\mathrm{d}t}{x^{3}}=f'(0)-\frac{2}{3}f'(0)=\frac{1}{3}f'(0)=\varphi'(0),$$

      这表明 $\varphi'(x)$ 在 $x=0$ 处连续，故选 (D)．
