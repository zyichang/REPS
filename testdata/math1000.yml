      #### 基础篇 第14章 (11) 设平面区域 $D=\{(x,y)\mid x^{3}\leqslant y\leqslant 1,-1\leqslant x\leqslant 1\}$，$f(x)$ 是定义在 $[-a,a]\ (a\geqslant 1)$ 上的任意连续函数，求 $\displaystyle\iint_{D}[(x+1)f(x)+(x-1)f(-x)]\sin y\,\mathrm{d}x\mathrm{d}y$．
    back: |
      【解析】由于 $f(x)+f(-x)$ 为**偶函数**，因而 $x[f(x)+f(-x)]$ 为**奇函数**．而 $f(x)-f(-x)$ 为奇函数．从而

      $$(x+1)f(x)+(x-1)f(-x)=x[f(x)+f(-x)]+[f(x)-f(-x)]$$

      为奇函数．

      于是

      $$原积分=\int_{-1}^{1}[(x+1)f(x)+(x-1)f(-x)]\mathrm{d}x\int_{x^{3}}^{1}\sin y\,\mathrm{d}y$$

      $$=\int_{-1}^{1}(\cos x^{3}-\cos 1)[(x+1)f(x)+(x-1)f(-x)]\mathrm{d}x=0.$$
