      #### 强化篇 第1章 (42) 函数 $f(x)=\dfrac{\left(\mathrm{e}^{\frac{1}{x-1}}-1\right)|x|}{(x+1)\ln|x-1|}$ 的第一类间断点的个数为（　）．

      ;;;
      (A) $0$
      (B) $1$
      (C) $2$
      (D) $3$
