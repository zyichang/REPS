      $$=\left.2\ln(x^{2}-x+1)\right|_{0}^{1}-\int_{0}^{1}\frac{1}{\left(x-\dfrac{1}{2}\right)^{2}+\left(\dfrac{\sqrt{3}}{2}\right)^{2}}\mathrm{d}x$$

      $$=-\left.\frac{2}{\sqrt{3}}\arctan\frac{x-\dfrac{1}{2}}{\dfrac{\sqrt{3}}{2}}\right|_{0}^{1}=-\frac{2}{\sqrt{3}}\left(\frac{\pi}{6}+\frac{\pi}{6}\right)=-\frac{2\sqrt{3}}{9}\pi.$$
