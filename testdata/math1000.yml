      #### 基础篇 第5章 (9) 曲线 $x^{2}-xy+y^{2}=1$ 在点 $(1,1)$ 处的曲率为 ________．
    back: |
      【答案】$\dfrac{3\sqrt{2}}{2}$

      【解析】对 $x^{2}-xy+y^{2}=1$ 的两边关于 $x$ 求导，有

      $$2x-\left(y+xy'\right)+2y\cdot y'=0,\qquad(*)$$

      代入 $x=1$，$y=1$ 得 $2-\left(1+y'\right)+2y'=0$，故 $y'(1)=-1$．

      $(*)$ 式两边再对 $x$ 求导，有

      $$2-y'-y'-xy''+2\left(y'\right)^{2}+2y\cdot y''=0,$$

      代入 $x=1$，$y=1$，$y'(1)=-1$，得 $4-y''+2+2y''=0$，故 $y''(1)=-6$．

      所以所求曲率为

      $$k=\frac{\left|y''\right|}{\left[1+\left(y'\right)^{2}\right]^{\frac{3}{2}}}\bigg|_{(1,1)}=\frac{3\sqrt{2}}{2}.$$
