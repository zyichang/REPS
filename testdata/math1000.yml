      【解析】

      $$\int\mathrm{e}^{2x}\arctan\sqrt{\mathrm{e}^{x}-1}\,\mathrm{d}x=\frac{1}{2}\int\arctan\sqrt{\mathrm{e}^{x}-1}\,\mathrm{d}(\mathrm{e}^{2x})=\frac{1}{2}\mathrm{e}^{2x}\arctan\sqrt{\mathrm{e}^{x}-1}-\frac{1}{4}\int\frac{\mathrm{e}^{2x}}{\sqrt{\mathrm{e}^{x}-1}}\mathrm{d}x.$$

      又

      $$\int\frac{\mathrm{e}^{2x}}{\sqrt{\mathrm{e}^{x}-1}}\mathrm{d}x=\int\frac{\mathrm{e}^{x}}{\sqrt{\mathrm{e}^{x}-1}}\mathrm{d}(\mathrm{e}^{x})=\int\frac{(\mathrm{e}^{x}-1)+1}{\sqrt{\mathrm{e}^{x}-1}}\mathrm{d}(\mathrm{e}^{x})$$

      $$=\int\sqrt{\mathrm{e}^{x}-1}\,\mathrm{d}(\mathrm{e}^{x})+\int\frac{1}{\sqrt{\mathrm{e}^{x}-1}}\mathrm{d}(\mathrm{e}^{x})=\frac{2}{3}(\mathrm{e}^{x}-1)\sqrt{\mathrm{e}^{x}-1}+2\sqrt{\mathrm{e}^{x}-1}+C_{1},$$

      所以

      $$\int\mathrm{e}^{2x}\arctan\sqrt{\mathrm{e}^{x}-1}\,\mathrm{d}x=\frac{1}{2}\mathrm{e}^{2x}\arctan\sqrt{\mathrm{e}^{x}-1}-\frac{1}{6}(\mathrm{e}^{x}+2)\sqrt{\mathrm{e}^{x}-1}+C.$$
