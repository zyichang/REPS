      #### 基础篇 第12章 (1) 设沿 $y$ 轴上的区间 $[0,1]$ 放置一长度为 $1$ 且线密度为 $\rho$ 的均匀细杆，在 $x$ 轴上 $x=1$ 处有一单位质点，则该细杆对此质点的引力（$G$ 为引力常量）沿 $x$ 轴正向的分力为 ________．
    back: |
      【答案】$-\dfrac{\sqrt{2}}{2}G\rho$

      【解析】依题意画出直角坐标系（略），用微元法．取 $y$ 轴上的 $[y,y+\mathrm{d}y]\subset[0,1]$，此微段细杆对质点的引力大小为 $\mathrm{d}F=G\cdot\dfrac{\rho\,\mathrm{d}y}{1+y^{2}}$，其在 $x$ 轴正向的分力为

      $$\mathrm{d}F_{x}=\frac{-1}{\sqrt{1+y^{2}}}\mathrm{d}F=-\frac{G\rho\,\mathrm{d}y}{(1+y^{2})^{\frac{3}{2}}},$$

      于是该细杆对此质点的引力沿 $x$ 轴正向的分力为

      $$F_{x}=\int_{0}^{1}\left[-\frac{G\rho}{(1+y^{2})^{\frac{3}{2}}}\right]\mathrm{d}y\xlongequal{\text{令}\ y=\tan t}-G\rho\int_{0}^{\frac{\pi}{4}}\cos t\,\mathrm{d}t=-\frac{\sqrt{2}}{2}G\rho.$$
