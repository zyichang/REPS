      $$\int_{0}^{1}\mathrm{e}^{-\sqrt{x}}\mathrm{d}x=2\int_{0}^{1}t\mathrm{e}^{-t}\mathrm{d}t=-\left.2t\mathrm{e}^{-t}\right|_{0}^{1}+2\int_{0}^{1}\mathrm{e}^{-t}\mathrm{d}t=-2\mathrm{e}^{-1}-\left.2\mathrm{e}^{-t}\right|_{0}^{1}=-4\mathrm{e}^{-1}+2=2-\frac{4}{\mathrm{e}}.$$

      故正确选项为 (B)．
