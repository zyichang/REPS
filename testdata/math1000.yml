      【答案】$\dfrac{1}{3}$

      【解析】

      $$\lim_{x\to 0}f(x)=\lim_{x\to 0}\left(\frac{1}{x\arctan x}-\frac{1}{x^{2}}\right)=\lim_{x\to 0}\frac{x-\arctan x}{x^{2}\arctan x}=\lim_{x\to 0}\frac{x-\arctan x}{x^{3}}$$

      $$=\lim_{x\to 0}\frac{1-\frac{1}{1+x^{2}}}{3x^{2}}=\lim_{x\to 0}\frac{x^{2}}{3x^{2}(1+x^{2})}=\frac{1}{3}.$$

      故要使函数 $f(x)=\dfrac{1}{x\arctan x}-\dfrac{1}{x^{2}}$ 在 $x=0$ 处连续，则应补充定义 $f(0)=\dfrac{1}{3}$．
