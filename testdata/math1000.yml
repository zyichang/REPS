      #### 强化篇 第1章 (35) 已知 $\lim\limits_{x\to+\infty}\dfrac{\displaystyle\int_{0}^{x}t^{2}\mathrm{e}^{x^{2}-t^{2}}\mathrm{d}t+a\mathrm{e}^{x^{2}}}{x^{b}}=-\dfrac{1}{2}$，求 $a,b$ 的值．
    back: |
      【解析】一开始，可能看不出是什么类型的未定式，作恒等变形（分子分母同时除以 $\mathrm{e}^{x^{2}}$）再看：

      $$\text{原式}=\lim_{x\to+\infty}\frac{\int_{0}^{x}t^{2}\mathrm{e}^{-t^{2}}\mathrm{d}t+a}{x^{b}\mathrm{e}^{-x^{2}}}=-\frac{1}{2},$$

      此时不论 $b$ 取何值，都有 $\lim\limits_{x\to+\infty}x^{b}\mathrm{e}^{-x^{2}}=0$，即判定为“$\dfrac{0}{0}$”型（事实上，变形前为“$\dfrac{\infty}{\infty}$”型），故

      $$\lim_{x\to+\infty}\left(\int_{0}^{x}t^{2}\mathrm{e}^{-t^{2}}\mathrm{d}t+a\right)=0,$$

      于是

      $$a=-\int_{0}^{+\infty}t^{2}\mathrm{e}^{-t^{2}}\mathrm{d}t=-\frac{1}{4}\Gamma\left(\frac{1}{2}\right)=-\frac{\sqrt{\pi}}{4},$$

      则

      $$\text{原式}=\lim_{x\to+\infty}\frac{\int_{0}^{x}t^{2}\mathrm{e}^{-t^{2}}\mathrm{d}t-\frac{\sqrt{\pi}}{4}}{x^{b}\mathrm{e}^{-x^{2}}}\xlongequal{\text{洛必达法则}}\lim_{x\to+\infty}\frac{x^{2}\mathrm{e}^{-x^{2}}}{bx^{b-1}\mathrm{e}^{-x^{2}}+x^{b}\mathrm{e}^{-x^{2}}(-2x)}=\lim_{x\to+\infty}\frac{x^{2}}{bx^{b-1}-2x^{b+1}}=-\frac{1}{2},$$

      故 $b=1$．
