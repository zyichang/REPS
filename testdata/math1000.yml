      #### 强化篇 第1章 (12) 设 $\lim\limits_{x\to 0}\dfrac{xf(x)+\ln(1-2x)}{x^{2}}=4$，则 $\lim\limits_{x\to 0}\dfrac{f(x)-2}{x}=$（　）．

      ;;;
      (A) $2$
      (B) $4$
      (C) $6$
      (D) $8$
      ;;;C
    back: |
      【答案】(C)

      【解析】

      $$\frac{f(x)-2}{x}-\frac{xf(x)+\ln(1-2x)}{x^{2}}=-\frac{\ln(1-2x)+2x}{x^{2}},$$

      所以

      $$\lim_{x\to 0}\frac{f(x)-2}{x}=\lim_{x\to 0}\left[\frac{xf(x)+\ln(1-2x)}{x^{2}}-\frac{\ln(1-2x)+2x}{x^{2}}\right]=4-\lim_{x\to 0}\frac{\ln(1-2x)+2x}{x^{2}}$$

      $$\xlongequal{\text{洛必达法则}}4-\lim_{x\to 0}\frac{\frac{-2}{1-2x}+2}{2x}=4-\lim_{x\to 0}\frac{-4x}{2x}=6.$$

      故选 (C)．
