      【答案】$\dfrac{\pi}{2}-\arcsin\dfrac{\sqrt{5}}{3}+\ln 3$

      【解析】

      $$\int_{\sqrt{5}}^{5}\frac{1}{\sqrt{|x^{2}-9|}}\mathrm{d}x=\int_{\sqrt{5}}^{3}\frac{1}{\sqrt{9-x^{2}}}\mathrm{d}x+\int_{3}^{5}\frac{1}{\sqrt{x^{2}-9}}\mathrm{d}x$$

      $$=\left.\arcsin\frac{x}{3}\right|_{\sqrt{5}}^{3}+\left.\ln\left|x+\sqrt{x^{2}-9}\right|\right|_{3}^{5}=\frac{\pi}{2}-\arcsin\frac{\sqrt{5}}{3}+\ln 3.$$
