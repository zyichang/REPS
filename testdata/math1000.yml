      #### 基础篇 第12章 (4)-(2) 设有一个内表面为旋转抛物面的容器，其深为 $a$ 米，容器口直径为 $2a$ 米，若以每秒 $Q$ 立方米的速率往容器内注水，求当容器中水深为 $\dfrac{1}{2}a$ 米时，水面上升的速率．
    back: |
      【解析】当容器中水深为 $h$ 米时，容器中水的体积为 $V(h)=\pi\displaystyle\int_{0}^{h}ay\,\mathrm{d}y=\frac{\pi a}{2}h^{2}$．由于

      $$Q=\frac{\mathrm{d}V}{\mathrm{d}t}=\frac{\mathrm{d}V}{\mathrm{d}h}\cdot\frac{\mathrm{d}h}{\mathrm{d}t}=\pi ah\,\frac{\mathrm{d}h}{\mathrm{d}t},$$

      故 $\dfrac{\mathrm{d}h}{\mathrm{d}t}=\dfrac{Q}{\pi ah}$，$\dfrac{\mathrm{d}h}{\mathrm{d}t}\bigg|_{h=\frac{1}{2}a}=\dfrac{2Q}{\pi a^{2}}$．于是，当容器中水深为 $\dfrac{1}{2}a$ 米时，水面上升的速率为每秒 $\dfrac{2Q}{\pi a^{2}}$ 米．
