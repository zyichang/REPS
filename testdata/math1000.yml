      #### 强化篇 第1章 (21) 设 $\alpha(x)$ 是 $x\to 0$ 时的非零无穷小量，且 $\alpha(2x)-\alpha(x)=o(x)$，则 $\lim\limits_{x\to 0}\dfrac{\alpha(x)}{x}$ 的值是（　）．

      ;;;
      (A) $0$
      (B) $1$
      (C) $\infty$
      (D) $0$ 或 $\infty$
      ;;;A
    back: |
      【答案】(A)

      【解析】由题意知，对于任意 $\varepsilon>0$，存在 $\delta>0$，当 $0<|x|<\delta$ 时，$|\alpha(2x)-\alpha(x)|<|x|\varepsilon$，故

      $$\left|\alpha(x)-\alpha\left(\frac{x}{2}\right)\right|<\left|\frac{x}{2}\right|\varepsilon,\quad \left|\alpha\left(\frac{x}{2}\right)-\alpha\left(\frac{x}{4}\right)\right|<\left|\frac{x}{4}\right|\varepsilon,\quad\cdots\cdots\quad \left|\alpha\left(\frac{x}{2^{n-1}}\right)-\alpha\left(\frac{x}{2^{n}}\right)\right|<\left|\frac{x}{2^{n}}\right|\varepsilon,$$

      于是

      $$\left|\alpha(x)-\alpha\left(\frac{x}{2^{n}}\right)\right|=\left|\alpha(x)-\alpha\left(\frac{x}{2}\right)+\alpha\left(\frac{x}{2}\right)-\alpha\left(\frac{x}{4}\right)+\cdots+\alpha\left(\frac{x}{2^{n-1}}\right)-\alpha\left(\frac{x}{2^{n}}\right)\right|$$

      $$\leqslant\left|\alpha(x)-\alpha\left(\frac{x}{2}\right)\right|+\left|\alpha\left(\frac{x}{2}\right)-\alpha\left(\frac{x}{4}\right)\right|+\cdots+\left|\alpha\left(\frac{x}{2^{n-1}}\right)-\alpha\left(\frac{x}{2^{n}}\right)\right|$$

      $$<\left|\frac{x}{2}\right|\varepsilon+\left|\frac{x}{4}\right|\varepsilon+\cdots+\left|\frac{x}{2^{n}}\right|\varepsilon=|x|\varepsilon\left[1-\left(\frac{1}{2}\right)^{n}\right].$$

      又当 $n\to\infty$ 时，$\alpha\left(\dfrac{x}{2^{n}}\right)\to 0$，所以 $\dfrac{|\alpha(x)|}{|x|}\leqslant\varepsilon$，即 $\lim\limits_{x\to 0}\dfrac{\alpha(x)}{x}=0$．
