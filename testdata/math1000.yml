      $$=\lim_{x\to 0}\frac{(\sin x+x)(\sin x-x)}{x^{4}}=\lim_{x\to 0}\frac{2x\cdot\left(-\frac{1}{6}x^{3}\right)}{x^{4}}=-\frac{1}{3}.$$
