      #### 强化篇 第1章 (43) 函数 $f(x)=\dfrac{(x^{2}-x)|x+1|}{\mathrm{e}^{\frac{1}{x}}\displaystyle\int_{1}^{x}t|\sin t|\mathrm{d}t}$ 的第一类间断点的个数为（　）．

      ;;;
      (A) $0$
      (B) $1$
      (C) $2$
      (D) $3$
      ;;;C
    back: |
      【答案】(C)

      【解析】令 $g(x)=\displaystyle\int_{1}^{x}t|\sin t|\mathrm{d}t$，则 $g(1)=0$，$g(-1)=0$．又 $g'(x)=x|\sin x|$，故当 $x\in[0,+\infty)$ 时，$g'(x)\geqslant 0$，当 $x\in(-\infty,0)$ 时，$g'(x)\leqslant 0$，于是 $g(x)$ 在 $(-\infty,+\infty)$ 上只有两个零点 $x=\pm 1$，故 $f(x)$ 共有三个间断点 $x=0,\pm 1$．

      在 $x=0$ 时，

      $$\lim_{x\to 0^{-}}f(x)=\lim_{x\to 0^{-}}\frac{(x-1)|x+1|}{\int_{1}^{x}t|\sin t|\mathrm{d}t}\cdot\lim_{x\to 0^{-}}\frac{x}{\mathrm{e}^{\frac{1}{x}}}=\frac{1}{\int_{0}^{1}t|\sin t|\mathrm{d}t}\lim_{x\to 0^{-}}\frac{x}{\mathrm{e}^{\frac{1}{x}}},$$

      其中 $\lim\limits_{x\to 0^{-}}\dfrac{x}{\mathrm{e}^{\frac{1}{x}}}\xlongequal{-\frac{1}{x}=t}-\lim\limits_{t\to+\infty}\dfrac{\mathrm{e}^{t}}{t}=-\infty$，则 $x=0$ 为无穷间断点．

      在 $x=-1$ 处，

      $$\lim_{x\to-1}f(x)=\lim_{x\to-1}\frac{x^{2}-x}{\mathrm{e}^{\frac{1}{x}}}\cdot\lim_{x\to-1}\frac{|x+1|}{\int_{1}^{x}t|\sin t|\mathrm{d}t}=2\mathrm{e}\cdot\lim_{x\to-1}\frac{|x+1|}{\int_{1}^{x}t|\sin t|\mathrm{d}t},$$

      其中

      $$\lim_{x\to(-1)^{+}}\frac{|x+1|}{\int_{1}^{x}t|\sin t|\mathrm{d}t}=\lim_{x\to(-1)^{+}}\frac{x+1}{\int_{1}^{x}t|\sin t|\mathrm{d}t}\xlongequal{\text{洛必达法则}}\lim_{x\to(-1)^{+}}\frac{1}{x|\sin x|}=-\frac{1}{\sin 1},$$

      同理可得 $\lim\limits_{x\to(-1)^{-}}\dfrac{|x+1|}{\displaystyle\int_{1}^{x}t|\sin t|\mathrm{d}t}=\dfrac{1}{\sin 1}$，则 $x=-1$ 为跳跃间断点．

      在 $x=1$ 处，

      $$\lim_{x\to 1}f(x)=\lim_{x\to 1}\frac{x|x+1|}{\mathrm{e}^{\frac{1}{x}}}\cdot\lim_{x\to 1}\frac{x-1}{\int_{1}^{x}t|\sin t|\mathrm{d}t}=\frac{2}{\mathrm{e}}\lim_{x\to 1}\frac{x-1}{\int_{1}^{x}t|\sin t|\mathrm{d}t}\xlongequal{\text{洛必达法则}}\frac{2}{\mathrm{e}}\lim_{x\to 1}\frac{1}{x|\sin x|}=\frac{2}{\mathrm{e}\cdot\sin 1},$$

      则 $x=1$ 为可去间断点．

      综上，函数 $f(x)=\dfrac{(x^{2}-x)|x+1|}{\mathrm{e}^{\frac{1}{x}}\displaystyle\int_{1}^{x}t|\sin t|\mathrm{d}t}$ 的第一类间断点的个数为 $2$，应选 (C)．

      【注】事实上，因 $t|\sin t|$ 为奇函数，故 $g(x)=\displaystyle\int_{1}^{x}t|\sin t|\mathrm{d}t$ 为偶函数，只需研究 $x\geqslant 0$ 时的性态即可，也就是 $g(-1)=g(1)$，$g(x)$ 在 $x=0$ 左、右两侧单调性相反．
