      #### 强化篇 第1章 (32) 设函数 $f(x)=x-[x]$，其中 $[x]$ 表示不超过 $x$ 的最大整数，求 $\lim\limits_{x\to+\infty}\dfrac{1}{x}\displaystyle\int_{0}^{x}f(t)\mathrm{d}t$．
    back: |
      【解析】当 $x\in[0,1)$ 时，$f(x)=x-[x]=x$，又由于

      $$f(x+1)=x+1-[x+1]=x+1-([x]+1)=x-[x]=f(x),$$

      故 $f(x)$ 是周期为 $1$ 的周期函数，其图像如图所示（图略）．

      当 $n\leqslant x<n+1$ 时，$\dfrac{n}{2}=\displaystyle\int_{0}^{n}f(t)\mathrm{d}t\leqslant\int_{0}^{x}f(t)\mathrm{d}t<\int_{0}^{n+1}f(t)\mathrm{d}t=\dfrac{n+1}{2}$，于是

      $$\frac{n}{2(n+1)}=\frac{1}{n+1}\int_{0}^{n}f(t)\mathrm{d}t<\frac{1}{x}\int_{0}^{x}f(t)\mathrm{d}t<\frac{1}{n}\int_{0}^{n+1}f(t)\mathrm{d}t=\frac{n+1}{2n}.$$

      当 $x\to+\infty$ 时，$n\to\infty$，由夹逼准则，有 $\lim\limits_{x\to+\infty}\dfrac{1}{x}\displaystyle\int_{0}^{x}f(t)\mathrm{d}t=\dfrac{1}{2}$．

      【注】本题考到了取整函数的两个重要公式：

      ①$[x+n]=[x]+n$，其中 $n$ 为正整数．\
      ②$x-1<[x]\leqslant x$．

      考生要熟悉它们．
