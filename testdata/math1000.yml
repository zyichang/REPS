      【解析】设 $x=a\tan t$，则 $\mathrm{d}x=a\sec^{2}t\,\mathrm{d}t$，当 $-\dfrac{\pi}{2}<t<\dfrac{\pi}{2}$ 时，$x=a\tan t$ 存在反函数．所以

      $$\int\frac{\mathrm{d}x}{\sqrt{x^{2}+a^{2}}}=\int\frac{a\sec^{2}t\,\mathrm{d}t}{a\sqrt{\tan^{2}t+1}}=\int\frac{\sec^{2}t}{\sec t}\mathrm{d}t=\int\sec t\,\mathrm{d}t=\ln|\sec t+\tan t|+C_{1}.$$

      由 $\tan t=\dfrac{x}{a}$ 得 $\sec t=\dfrac{\sqrt{a^{2}+x^{2}}}{a}$，所以

      $$\int\frac{\mathrm{d}x}{\sqrt{x^{2}+a^{2}}}=\ln|\sec t+\tan t|+C_{1}=\ln\left(\frac{\sqrt{x^{2}+a^{2}}}{a}+\frac{x}{a}\right)+C_{1}=\ln\left(\sqrt{x^{2}+a^{2}}+x\right)+C.$$
