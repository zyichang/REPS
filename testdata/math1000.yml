      【解析】

      $$\lim_{x\to 0^{+}}\frac{1-\left(\frac{\sin x}{x}\right)^{x}}{x^{3}}=\lim_{x\to 0^{+}}\frac{-x\ln\frac{\sin x}{x}}{x^{3}}=\lim_{x\to 0^{+}}\frac{x\left(1-\frac{\sin x}{x}\right)}{x^{3}}=\lim_{x\to 0^{+}}\frac{x-\sin x}{x^{3}}=\frac{1}{6}.$$
