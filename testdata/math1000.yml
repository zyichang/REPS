      #### 基础篇 第14章 (13) 计算 $\displaystyle\iint_{D}f(x,y)\mathrm{d}\sigma$，其中 $D=\{(x,y)\mid x^{2}+y^{2}\geqslant 2x\}$，$f(x,y)=\begin{cases}y,&1\leqslant x\leqslant 2,0\leqslant y\leqslant x,\\ 0,&其他.\end{cases}$
    back: |
      【解析】被积函数 $f(x,y)$ 的非零区域和积分区域的公共部分由 $y=x$、$x=2$ 及圆 $x^{2}+y^{2}=2x$ 界定，故

      $$\iint_{D}f(x,y)\mathrm{d}\sigma=\int_{0}^{\frac{\pi}{4}}\mathrm{d}\theta\int_{2\cos\theta}^{\frac{2}{\cos\theta}}r\sin\theta\cdot r\,\mathrm{d}r$$

      $$=\frac{1}{3}\int_{0}^{\frac{\pi}{4}}\sin\theta\cdot r^{3}\bigg|_{2\cos\theta}^{\frac{2}{\cos\theta}}\mathrm{d}\theta$$

      $$=\frac{8}{3}\int_{0}^{\frac{\pi}{4}}\left(\frac{\sin\theta}{\cos^{3}\theta}-\cos^{3}\theta\sin\theta\right)\mathrm{d}\theta$$

      $$=\frac{8}{3}\left(\frac{1}{2}\frac{1}{\cos^{2}\theta}+\frac{1}{4}\cos^{4}\theta\right)\bigg|_{0}^{\frac{\pi}{4}}=\frac{5}{6}.$$
