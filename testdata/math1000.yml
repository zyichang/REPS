      #### 基础篇 第12章 (5) 以 $yOz$ 面上的平面曲线段 $y=f(z)\ (z\geqslant 0)$ 绕 $z$ 轴旋转一周所成旋转曲面与 $xOy$ 面围成一个无上盖容器（见图），现以 $3\ \mathrm{cm^{3}/s}$ 的速率把水注入容器内，水面的面积以 $\pi\ \mathrm{cm^{2}/s}$ 的速率增大．已知容器底面积为 $16\pi\ \mathrm{cm^{2}}$，求曲线 $y=f(z)$ 的方程．
    back: |
      【解析】记 $t$ 时刻容器的水深为 $z(t)$，则注入的水的体积为

      $$V(t)=\int_{0}^{z(t)}\pi f^{2}(u)\mathrm{d}u,$$

      水面的面积

      $$S(t)=\pi f^{2}(z).$$

      由题意，

      $$\frac{\mathrm{d}[V(t)]}{\mathrm{d}t}=\pi f^{2}[z(t)]\cdot\frac{\mathrm{d}z}{\mathrm{d}t}=3,$$

      $$\frac{\mathrm{d}[S(t)]}{\mathrm{d}t}=\pi\cdot 2f[z(t)]\frac{\mathrm{d}\{f[z(t)]\}}{\mathrm{d}z}\cdot\frac{\mathrm{d}z}{\mathrm{d}t}=\pi,$$

      故

      $$\frac{\mathrm{d}[f(z)]}{\mathrm{d}z}\cdot\frac{2}{f(z)}=\frac{\pi}{3},$$

      分离变量，得

      $$\frac{\mathrm{d}[f(z)]}{f(z)}=\frac{\pi}{6}\mathrm{d}z,$$

      于是 $\displaystyle\int\frac{\mathrm{d}[f(z)]}{f(z)}=\frac{\pi}{6}\int\mathrm{d}z$，得

      $$\ln|f(z)|=\frac{\pi}{6}z+\ln C_{1},\quad f(z)=\pm C_{1}\mathrm{e}^{\frac{\pi}{6}z}=C\mathrm{e}^{\frac{\pi}{6}z}\ (z\geqslant 0),$$

      其中 $C$ 为任意常数，又底面积为 $16\pi\ \mathrm{cm^{2}}$，即 $f(0)=\pm 4$，得 $C=\pm 4$，即 $f(z)=\pm 4\mathrm{e}^{\frac{\pi}{6}z}$．
