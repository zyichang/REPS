      【答案】(A)

      【解析】因为

      $$F(x)=\int_{-\pi}^{\pi}|x-t|\sin t\,\mathrm{d}t=\int_{-\pi}^{x}(x-t)\sin t\,\mathrm{d}t+\int_{x}^{\pi}(t-x)\sin t\,\mathrm{d}t$$

      $$=x\int_{-\pi}^{x}\sin t\,\mathrm{d}t-\int_{-\pi}^{x}t\sin t\,\mathrm{d}t+\int_{x}^{\pi}t\sin t\,\mathrm{d}t-x\int_{x}^{\pi}\sin t\,\mathrm{d}t,$$

      所以

      $$F'(x)=\int_{-\pi}^{x}\sin t\,\mathrm{d}t+x\sin x-x\sin x-x\sin x-\int_{x}^{\pi}\sin t\,\mathrm{d}t+x\sin x=\int_{-\pi}^{x}\sin t\,\mathrm{d}t-\int_{x}^{\pi}\sin t\,\mathrm{d}t,$$

      即

      $$F'(0)=\int_{-\pi}^{0}\sin t\,\mathrm{d}t-\int_{0}^{\pi}\sin t\,\mathrm{d}t=-\left.\cos t\right|_{-\pi}^{0}+\left.\cos t\right|_{0}^{\pi}=-4.$$

      故正确选项为 (A)．
