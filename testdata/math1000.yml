      #### 基础篇 第12章 (4)-(1) 设有一个内表面为旋转抛物面的容器，其深为 $a$ 米，容器口直径为 $2a$ 米，若以每秒 $Q$ 立方米的速率往容器内注水，求容器的容积及内表面的面积．
    back: |
      【解析】以容器底中心为原点，对称轴为 $y$ 轴，在轴截面上建立平面直角坐标系，则可设容器内表面（旋转抛物面）是由抛物线 $y=kx^{2}$ 绕 $y$ 轴旋转而成的．根据题意，$y(a)=a$，故 $k=\dfrac{1}{a}$，即抛物线方程为 $y=\dfrac{1}{a}x^{2}$．于是，容器的容积为

      $$V=\pi\int_{0}^{a}x^{2}\mathrm{d}y=\pi\int_{0}^{a}ay\,\mathrm{d}y=\frac{\pi a^{3}}{2}\ (\text{立方米}).$$

      容器内表面的面积为

      $$S=2\pi\int_{0}^{a}\sqrt{ay}\sqrt{1+\left(\frac{\mathrm{d}x}{\mathrm{d}y}\right)^{2}}\,\mathrm{d}y=2\pi\int_{0}^{a}\sqrt{ay}\sqrt{1+\left(\frac{\sqrt{a}}{2\sqrt{y}}\right)^{2}}\,\mathrm{d}y$$

      $$=\sqrt{a}\pi\int_{0}^{a}\sqrt{4y+a}\,\mathrm{d}y=\frac{(5\sqrt{5}-1)\pi a^{2}}{6}\ (\text{平方米}).$$
