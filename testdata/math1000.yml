      #### 基础篇 第9章 (1)-(11) 计算不定积分 $\displaystyle\int\frac{1}{\sqrt{x^{2}-a^{2}}}\mathrm{d}x\ (a>0)$．
    back: |
      【解析】设 $x=a\sec t$，有 $\mathrm{d}x=a\sec t\tan t\,\mathrm{d}t$．

      当 $0<t<\dfrac{\pi}{2}$ 时，$x=a\sec t>0$，且存在反函数．

      $$\int\frac{\mathrm{d}x}{\sqrt{x^{2}-a^{2}}}=\int\frac{a\sec t\tan t}{a\tan t}\mathrm{d}t=\int\sec t\,\mathrm{d}t=\ln(\sec t+\tan t)+C_{1}=\ln\left(x+\sqrt{x^{2}-a^{2}}\right)+C.$$

      当 $\dfrac{\pi}{2}<t<\pi$ 时，$x=a\sec t<0$，且存在反函数．

      $$\int\frac{\mathrm{d}x}{\sqrt{x^{2}-a^{2}}}=-\int\sec t\,\mathrm{d}t=-\ln(-\sec t-\tan t)+C_{2}$$

      $$=-\ln\left(-x+\sqrt{x^{2}-a^{2}}\right)+C_{3}=\ln\left(-x-\sqrt{x^{2}-a^{2}}\right)+C.$$

      综上，

      $$\int\frac{\mathrm{d}x}{\sqrt{x^{2}-a^{2}}}=\ln\left|x+\sqrt{x^{2}-a^{2}}\right|+C.$$
