      对于 (D) 选项，$x-\tan x\sim-\dfrac{1}{3}x^{3}$，$\arctan x\sim x$，则有 $\displaystyle\int_{0}^{x-\tan x}\arctan t\,\mathrm{d}t\sim\int_{0}^{-\frac{1}{3}x^{3}}t\,\mathrm{d}t=\dfrac{1}{18}x^{6}$．

      综上，阶数最高的是 (D) 选项．

