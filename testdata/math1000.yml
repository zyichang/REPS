      #### 基础篇 第14章 (2) $\displaystyle\int_{0}^{t}\mathrm{d}y\int_{\sqrt{y}}^{\sqrt{t}}\sqrt{1+x^{3}}\,\mathrm{d}x=$ ________．
    back: |
      【答案】$\dfrac{2}{9}\left[(1+t^{\frac{3}{2}})^{\frac{3}{2}}-1\right]$

      【解析】积分区域为 $y=x^{2}$、$x=\sqrt{t}$ 与 $x$ 轴所围区域，则

      $$原式=\int_{0}^{\sqrt{t}}\sqrt{1+x^{3}}\,\mathrm{d}x\int_{0}^{x^{2}}\mathrm{d}y$$

      $$=\int_{0}^{\sqrt{t}}x^{2}\sqrt{1+x^{3}}\,\mathrm{d}x=\frac{1}{3}\int_{0}^{\sqrt{t}}\sqrt{1+x^{3}}\,\mathrm{d}(x^{3})$$

      $$=\frac{1}{3}\int_{0}^{\sqrt{t}}\sqrt{1+x^{3}}\,\mathrm{d}(x^{3}+1)=\frac{1}{3}\cdot\frac{2}{3}(1+x^{3})^{\frac{3}{2}}\bigg|_{0}^{\sqrt{t}}$$

      $$=\frac{2}{9}\left[(1+t^{\frac{3}{2}})^{\frac{3}{2}}-1\right].$$
