      #### 基础篇 第12章 (3)-(1) 在一个高为 $1\ \mathrm{m}$ 的圆柱形容器内储存某种液体，并将容器横放．底面圆的方程为 $x^{2}+y^{2}=1$（单位：$\mathrm{m}$）．如果容器内储满了液体后，以 $0.2\ \mathrm{m^{3}/min}$ 的速率将液体从容器顶端抽出．当液面在 $y=0$ 时，求液面下降的速率．
    back: |
      【解析】当液面在 $y\ (-1\leqslant y\leqslant 1)$ 处时，容器内液体的体积为

      $$V=2\int_{-1}^{y}\sqrt{1-u^{2}}\,\mathrm{d}u.$$

      设 $t$ 时刻液体的体积为 $V=V(t)$，则

      $$\frac{\mathrm{d}V}{\mathrm{d}t}=\frac{\mathrm{d}V}{\mathrm{d}y}\cdot\frac{\mathrm{d}y}{\mathrm{d}t}=2\sqrt{1-y^{2}}\,\frac{\mathrm{d}y}{\mathrm{d}t},$$

      令 $y=0$ 并由条件 $\dfrac{\mathrm{d}V}{\mathrm{d}t}=0.2$ 得 $\dfrac{\mathrm{d}y}{\mathrm{d}t}=0.1$，故液面在 $y=0$ 时，液面下降的速率为 $0.1\ \mathrm{m/min}$．
  - front: |
