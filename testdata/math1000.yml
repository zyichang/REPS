      #### 强化篇 第1章 (8) $\lim\limits_{x\to 0}\left(x+\mathrm{e}^{x}\right)^{\frac{\mathrm{e}}{x}}=$ ________．
    back: |
      【答案】$\mathrm{e}^{2\mathrm{e}}$

      【解析】$\lim\limits_{x\to 0}\left(x+\mathrm{e}^{x}\right)^{\frac{\mathrm{e}}{x}}=\mathrm{e}^{\lim\limits_{x\to 0}\frac{\mathrm{e}\left(x+\mathrm{e}^{x}-1\right)}{x}}$，而

      $$\lim_{x\to 0}\frac{\mathrm{e}\left(x+\mathrm{e}^{x}-1\right)}{x}=\lim_{x\to 0}\frac{\mathrm{e}x}{x}+\lim_{x\to 0}\frac{\mathrm{e}\left(\mathrm{e}^{x}-1\right)}{x}=2\mathrm{e},$$

      所以 $\lim\limits_{x\to 0}\left(x+\mathrm{e}^{x}\right)^{\frac{\mathrm{e}}{x}}=\mathrm{e}^{2\mathrm{e}}$．
