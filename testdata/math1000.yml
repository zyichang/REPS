      【答案】(D)

      【解析】函数 $g(x)=\mathrm{e}^{\sqrt{x^{2}-2x+1}}=\mathrm{e}^{|x-1|}$ 的定义域是 $(-\infty,+\infty)$，利用“初等函数在其定义区间上是连续的”这一结论可得 $g(x)$ 在 $x=1$ 处连续，故排除选项 (A) 和 (B)．

      又因为

      $$g'_{+}(1)=\lim_{x\to 1^{+}}\frac{g(x)-g(1)}{x-1}=\lim_{x\to 1^{+}}\frac{\mathrm{e}^{|x-1|}-1}{x-1}=\lim_{x\to 1^{+}}\frac{|x-1|}{x-1}=1,$$

      $$g'_{-}(1)=\lim_{x\to 1^{-}}\frac{g(x)-g(1)}{x-1}=\lim_{x\to 1^{-}}\frac{\mathrm{e}^{|x-1|}-1}{x-1}=\lim_{x\to 1^{-}}\frac{|x-1|}{x-1}=-1,$$

      所以 $g'_{+}(1)\neq g'_{-}(1)$，故 $g(x)$ 在 $x=1$ 处不可导．故正确选项为 (D)．
