      #### 基础篇 第9章 (16) 若 $F(x)=\displaystyle\int_{-\pi}^{\pi}|x-t|\sin t\,\mathrm{d}t$，则 $F'(0)=$（　）．

      ;;;
      A. $-4$
      B. $-2$
      C. $2$
      D. $4$
      ;;;A
